: space-between; align-items: center; margin-bottom: 12px;\">\n                  <span style=\"color: #8a93a0; font-size: 11px; font-weight: 600;\">STATUS BAYARAN<\u002Fspan>\n                  <span style=\"background: ${isComplete(booking) ? '#6f9b7e' : '#bd9a5f'}; color: #fff; font-size: 11px; font-weight: 600; padding: 4px 12px; border-radius: 20px;\">${isComplete(booking) ? '✓ PAID' : 'PENDING'}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #e1e6ed; padding-top: 12px;\">\n                  <span style=\"color: #4a525e; font-size: 15px; font-weight: 600;\">JUMLAH<\u002Fspan>\n                  <span style=\"color: #2b3340; font-size: 26px; font-weight: 800;\">RM${booking.price}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <!-- Footer -->\n              <div style=\"text-align: center; padding-top: 8px;\">\n                <div style=\"font-weight: 600; color: #4a525e; font-size: 13px; margin-bottom: 6px;\">Terima kasih kerana memilih kami!<\u002Fdiv>\n                <div style=\"font-size: 10px; color: #9aa3b0; line-height: 1.6;\">Resit ini dijana secara digital. Tiada tandatangan diperlukan.<br>Simpan resit ini sebagai bukti pembayaran anda.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <!-- Bottom brand band -->\n            <div style=\"background: #f7f8fa; padding: 12px; text-align: center; font-size: 10px; color: #9aa3b0; border-top: 1px solid #eceef2;\">\n              Cuci Seat, Kusyen, Karpet Kereta • Pakar Hygiene Dalaman Kereta\n            <\u002Fdiv>\n          <\u002Fdiv>\n        `;\n        document.getElementById('receipt-content').innerHTML = receiptHTML;\n        goToPage('receipt');\n      }\n    }\n\n    function printReceipt() {\n      window.print();\n    }\n\n    function shareToWhatsApp() {\n      const booking = state.bookings.find(b => b.id == currentReceiptId);\n      if (!booking) {\n        alert('Please open a receipt first');\n        return;\n      }\n\n      const receiptNo = 'RCP' + String(booking.id).slice(-6);\n      const filename = `${receiptNo}_${booking.name}.pdf`;\n\n      // Save PDF first (downloads to device), then open WhatsApp\n      generateReceiptPDF(booking, filename, true).then(() => {\n        setTimeout(() => {\n          let phone = booking.phone || '';\n          if (phone.startsWith('0')) {\n            phone = '60' + phone.substring(1);\n          } else if (!phone.startsWith('60')) {\n            phone = '60' + phone;\n          }\n\n          const message = `*RESIT - ${receiptNo}*\\n\\n` +\n            `📋 Pelanggan: ${booking.name}\\n` +\n            `🚗 Kenderaan: ${booking.car} (${booking.plate || '-'})\\n` +\n            `💵 Jumlah: RM${booking.price}\\n\\n` +\n            `Resit PDF telah dimuat turun ke peranti anda.\\n` +\n            `Sila lampirkan fail: ${filename}\\n\\n` +\n            `Terima kasih kerana memilih perkhidmatan kami! 😊`;\n\n          const encodedMsg = encodeURIComponent(message);\n          window.open(`https://wa.me/${phone}?text=${encodedMsg}`, '_blank');\n        }, 600);\n      });\n    }\n\n    // Reliable PDF generator: html2canvas -> jsPDF (page sized to content = valid single-page PDF on mobile)\n    // Lazy-load PDF libraries only when needed (keeps app start fast)\n    let _pdfLibsPromise = null;\n    function loadPdfLibs() {\n      if (window.jspdf && window.html2canvas) return Promise.resolve();\n      if (_pdfLibsPromise) return _pdfLibsPromise;\n      _pdfLibsPromise = new Promise((resolve, reject) => {\n        let loaded = 0;\n        const done = () => { if (++loaded === 2) resolve(); };\n        const s1 = document.createElement('script');\n        s1.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';\n        s1.onload = done; s1.onerror = () => reject(new Error('html2canvas load failed'));\n        const s2 = document.createElement('script');\n        s2.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';\n        s2.onload = done; s2.onerror = () => reject(new Error('jspdf load failed'));\n        document.head.appendChild(s1);\n        document.head.appendChild(s2);\n      });\n      return _pdfLibsPromise;\n    }\n\n    async function generateReceiptPDF(booking, filename, save) {\n      try { await loadPdfLibs(); }\n      catch (e) { alert('⚠️ Gagal muat library PDF. Check internet & cuba lagi.'); throw e; }\n      const source = document.getElementById('receipt-printable');\n      if (!source) { alert('Receipt not found'); return Promise.reject(); }\n\n      // Off-screen holder with exact width, no centering margins\n      const holder = document.createElement('div');\n      holder.style.position = 'fixed';\n      holder.style.left = '-10000px';\n      holder.style.top = '0';\n      holder.style.width = '480px';\n      holder.style.background = '#ffffff';\n\n      const clone = source.cloneNode(true);\n      clone.style.margin = '0';\n      clone.style.border = 'none';\n      holder.appendChild(clone);\n      document.body.appendChild(holder);\n\n      try {\n        const canvas = await html2canvas(clone, {\n          scale: 2,\n          backgroundColor: '#ffffff',\n          useCORS: true,\n          windowWidth: 480,\n          width: 480\n        });\n\n        const imgData = canvas.toDataURL('image/jpeg', 0.95);\n        const JsPDF = (window.jspdf && window.jspdf.jsPDF) ? window.jspdf.jsPDF : null;\n        if (!JsPDF) throw new Error('jsPDF not loaded');\n\n        // Page size = image size (in px) -> no cropping, no blank A4 area, valid PDF\n        const pdf = new JsPDF({\n          orientation: 'portrait',\n          unit: 'px',\n          format: [canvas.width, canvas.height],\n          hotfixes: ['px_scaling']\n        });\n        pdf.addImage(imgData, 'JPEG', 0, 0, canvas.width, canvas.height);\n\n        const blob = pdf.output('blob');\n        if (save) pdf.save(filename);\n\n        if (document.body.contains(holder)) document.body.removeChild(holder);\n        return blob;\n      } catch (err) {\n        if (document.body.contains(holder)) document.body.removeChild(holder);\n        console.error('PDF generation failed:', err);\n        alert('⚠️ Gagal jana PDF. Cuba guna butang Print untuk save sebagai PDF.');\n        throw err;\n      }\n    }\n\n    function savePDF() {\n      const booking = state.bookings.find(b => b.id == currentReceiptId);\n      if (!booking) {\n        alert('Please open a receipt first');\n        return;\n      }\n      const receiptNo = 'RCP' + String(booking.id).slice(-6);\n      const filename = `${receiptNo}_${booking.name}.pdf`;\n      generateReceiptPDF(booking, filename, true);\n    }\n\n    function logout() {\n      if (typeof firebase !== 'undefined' && firebase.auth) {\n        firebase.auth().signOut().catch(() => {});\n      }\n      showLoginScreen();\n    }\n\n    function updateClock() {\n      const now = new Date();\n      const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];\n      const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];\n      const dayName = days[now.getDay()];\n      const dateStr = now.getDate() + ' ' + months[now.getMonth()] + ' ' + now.getFullYear();\n      let h = now.getHours();\n      const ampm = h >= 12 ? 'PM' : 'AM';\n      h = h % 12; if (h === 0) h = 12;\n      const m = String(now.getMinutes()).padStart(2, '0');\n      const timeStr = h + ':' + m + ' ' + ampm;\n      document.getElementById('live-clock').textContent = dayName + ', ' + dateStr + '  •  ' + timeStr;\n    }\n\n    function filterByStatus(status) {\n      // Clear search first\n      const searchBox = document.getElementById('search-box');\n      if (searchBox) searchBox.value = '';\n      \n      // Navigate to bookings page\n      goToPage('bookings');\n      \n      // Filter and display\n      let bookings;\n      if (status === 'Enquiry') {\n        bookings = state.bookings.filter(b => b.status === 'Enquiry');\n      } else if (status === 'Completed') {\n        // Handle both \"Completed\" and \"Complete\" statuses\n        bookings = state.bookings.filter(b => b.status === 'Completed' || b.status === 'Complete');\n      } else {\n        bookings = state.bookings.filter(b => b.status === status && b.status !== 'Enquiry');\n      }\n      bookings = bookings.slice().sort(bookingSortCmp);\n      \n      const html = bookings.length ? bookings.map(b => `\n        <div class=\"booking-card\">\n          <div class=\"card-header\">\n            <div>\n              <span class=\"card-badge\" style=\"${statusBadgeStyle(b.status)}\">${b.status}<\u002Fspan>\n              <div class=\"card-name\">${b.name}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          ${dateTimeBar(b)}\n          <div class=\"card-detail-box\">\n            <div class=\"detail-row\">\n              <div class=\"detail-label\">📱 Phone:<\u002Fdiv>\n              <div class=\"detail-value\">${b.phone}<\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"detail-row\">\n              <div class=\"detail-label\">🚗 Car:<\u002Fdiv>\n              <div class=\"detail-value\">${b.car} ${b.plate ? '(' + b.plate + ')' : ''}<\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"detail-row\">\n              <div class=\"detail-label\">🔧 Service:<\u002Fdiv>\n              <div class=\"detail-value\">${b.service}<\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"detail-row\">\n              <div class=\"detail-label\">💵 Price:<\u002Fdiv>\n              <div class=\"detail-value\" style=\"color: #10b981; font-weight: 700;\">RM${b.price}<\u002Fdiv>\n            <\u002Fdiv>\n            ${b.material ? '<div class=\"detail-row\"><div class=\"detail-label\">📦 Material:<\u002Fdiv><div class=\"detail-value\">RM' + b.material + '<\u002Fdiv><\u002Fdiv>' : ''}\n            ${b.notes ? '<div class=\"detail-row\"><div class=\"detail-label\">📝 Notes:<\u002Fdiv><div class=\"detail-value\">' + b.notes + '<\u002Fdiv><\u002Fdiv>' : ''}\n            <div class=\"detail-row\">\n              <div class=\"detail-label\">📊 Status:<\u002Fdiv>\n              <select onchange=\"updateStatus('${b.id}', this.value)\" style=\"flex: 1; padding: 6px; border: 1px solid #ddd; border-radius: 4px;\">\n                <option value=\"Enquiry\" ${b.status === 'Enquiry' ? 'selected' : ''}>Enquiry<\u002Foption>\n                <option value=\"Pending\" ${b.status === 'Pending' ? 'selected' : ''}>Pending<\u002Foption>\n                <option value=\"Booking\" ${b.status === 'Booking' ? 'selected' : ''}>Booking<\u002Foption>\n                <option value=\"Postponed\" ${b.status === 'Postponed' ? 'selected' : ''}>Postponed<\u002Foption>\n                <option value=\"Completed\" ${b.status === 'Completed' || b.status === 'Complete' ? 'selected' : ''}>Completed<\u002Foption>\n                <option value=\"Cancelled\" ${b.status === 'Cancelled' ? 'selected' : ''}>Cancelled<\u002Foption>\n              <\u002Fselect>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"card-buttons\">\n            ${b.status === 'Pending'\n              ? `<button class=\"btn btn-deposit\" onclick=\"requestDeposit('${b.id}')\">💰 Minta Deposit<\u002Fbutton>`\n              : (b.status === 'Completed' || b.status === 'Complete')\n                ? `<button class=\"btn btn-pickup\" onclick=\"sendPickup('${b.id}')\">🚗 Sedia Pickup<\u002Fbutton>`\n                : `<button class=\"btn btn-whatsapp\" onclick=\"sendWhatsApp('${b.id}')\">✅ Pengesahan<\u002Fbutton>`}\n            <button class=\"btn btn-edit\" onclick=\"editBooking('${b.id}')\">✏️ Edit<\u002Fbutton>\n            <button class=\"btn btn-convert\" onclick=\"showReceipt('${b.id}')\">📄 Receipt<\u002Fbutton>\n            <button class=\"btn btn-secondary\" onclick=\"deleteBooking('${b.id}')\">🗑️ Delete<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      `).join('') : '<div class=\"empty\">No bookings with ' + status + ' status<\u002Fdiv>';\n      document.getElementById('bookings-list').innerHTML = html;\n    }\n\n    /* ============ CALENDAR ============ */\n    const STATUS_COLORS = {\n      'Enquiry': '#7c3aed', 'Booking': '#4f46e5', 'Pending': '#d97706',\n      'Confirmed': '#059669', 'Postponed': '#2f6e64', 'Completed': '#0d9488',\n      'Complete': '#0d9488', 'Cancelled': '#dc2626', 'No-Show': '#1f2937'\n    };\n\n    // Soft coloured badge per status (so list senang sort by warna)\n    function statusBadgeStyle(status) {\n      const c = STATUS_COLORS[status] || '#64748b';\n      return 'background:' + c + '22; color:' + c + '; border:1px solid ' + c + '55;';\n    }\n\n    // ===== Cuti Umum & Cuti Sekolah Selangor 2026 =====\n    const PUBLIC_HOLIDAYS = {\n      '2026-01-01': 'Tahun Baru', '2026-02-01': 'Thaipusam & Hari Wilayah', '2026-02-02': 'Cuti Ganti (Thaipusam/Wilayah)',\n      '2026-02-17': 'Tahun Baru Cina', '2026-02-18': 'Tahun Baru Cina (Hari 2)',\n      '2026-03-07': 'Nuzul Al-Quran', '2026-03-21': 'Hari Raya Aidilfitri',\n      '2026-03-22': 'Hari Raya Aidilfitri (2)', '2026-03-23': 'Cuti Hari Raya',\n      '2026-05-01': 'Hari Pekerja', '2026-05-27': 'Hari Raya Haji', '2026-05-31': 'Hari Wesak',\n      '2026-06-01': 'Cuti Wesak / Hari Agong', '2026-06-17': 'Awal Muharram',\n      '2026-08-25': 'Maulidur Rasul', '2026-08-31': 'Hari Merdeka', '2026-09-16': 'Hari Malaysia',\n      '2026-11-08': 'Deepavali', '2026-11-09': 'Cuti Deepavali',\n      '2026-12-11': 'Keputeraan Sultan Selangor', '2026-12-25': 'Hari Krismas'\n    };\n    // Cuti sekolah Kumpulan B (termasuk Selangor) 2026 — julat [mula, tamat] inklusif\n    const SCHOOL_HOLIDAYS = [\n      ['2026-02-16', '2026-02-20', 'Cuti Tahun Baru Cina'],\n      ['2026-03-18', '2026-03-29', 'Cuti Penggal 1 / Aidilfitri'],\n      ['2026-05-23', '2026-06-07', 'Cuti Pertengahan Tahun'],\n      ['2026-08-29', '2026-09-06', 'Cuti Penggal 2'],\n      ['2026-11-10', '2026-11-10', 'Cuti Deepavali'],\n      ['2026-12-05', '2026-12-31', 'Cuti Akhir Tahun']\n    ];\n    function publicHoliday(d) { return PUBLIC_HOLIDAYS[d] || null; }\n    function schoolHoliday(d) {\n      for (const r of SCHOOL_HOLIDAYS) { if (d >= r[0] && d <= r[1]) return r[2]; }\n      return null;\n    }\n\n    // ===== Kedai tutup (closed days) =====\n    function isClosed(d) { return (state.closedDates || []).indexOf(d) !== -1; }\n    async function toggleClosed(d) {\n      state.closedDates = state.closedDates || [];\n      const i = state.closedDates.indexOf(d);\n      if (i === -1) state.closedDates.push(d); else state.closedDates.splice(i, 1);\n      persistLocal();\n      renderCalendar();\n      showCalDay(d);\n      if (fbReady()) {\n        try { await firebase.firestore().collection('config').doc('closedDates').set({ dates: state.closedDates }); } catch (e) { console.warn('closedDates sync', e); }\n      }\n    }\n\n    // ===== Booking multi-hari (kereta tinggal beberapa hari) =====\n    function ymd(dt) { return dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0'); }\n    function bookingDates(b) {\n      if (!b.date) return [];\n      const start = b.date.slice(0, 10);\n      const end = (b.endDate || b.date).slice(0, 10);\n      const out = []; let d = new Date(start + 'T00:00:00'); const endD = new Date(end + 'T00:00:00'); let guard = 0;\n      while (d <= endD && guard < 90) { out.push(ymd(d)); d.setDate(d.getDate() + 1); guard++; }\n      return out.length ? out : [start];\n    }\n    function setBookingDays(id) {\n      const b = state.bookings.find(x => x.id == id); if (!b) return;\n      const cur = b.endDate ? bookingDates(b).length : 1;\n      const inp = prompt('Berapa HARI kereta ' + b.name + ' ada di kedai?\\n(1 = sehari sahaja, 3 = tiga hari berturut)', String(cur));\n      if (inp === null) return;\n      const days = Math.max(1, parseInt(inp) || 1);\n      if (days <= 1) { delete b.endDate; }\n      else { const s = new Date(b.date.slice(0, 10) + 'T00:00:00'); s.setDate(s.getDate() + days - 1); b.endDate = ymd(s); }\n      b._synced = false; persistLocal(); renderCalendar(); showCalDay(b.date.slice(0, 10));\n      fbSet('bookings', b.id, b).then(ok => { b._synced = ok; persistLocal(); updateSyncStatus(); });\n    }\n\n    function changeMonth(delta) {\n      calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + delta, 1);\n      renderCalendar();\n      document.getElementById('cal-day-detail').innerHTML = '';\n    }\n\n    function renderCalendar() {\n      const dowRow = document.getElementById('cal-dow-row');\n      const grid = document.getElementById('cal-grid');\n      const label = document.getElementById('cal-month-label');\n      if (!grid) return;\n\n      const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];\n      label.textContent = months[calMonth.getMonth()] + ' ' + calMonth.getFullYear();\n      dowRow.innerHTML = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d => `<div class=\"cal-dow\">${d}<\u002Fdiv>`).join('');\n\n      const year = calMonth.getFullYear(), month = calMonth.getMonth();\n      const firstDay = new Date(year, month, 1).getDay();\n      const daysInMonth = new Date(year, month + 1, 0).getDate();\n      const today = new Date();\n\n      let cells = '';\n      for (let i = 0; i < firstDay; i++) cells += '<div class=\"cal-cell empty-cell\"><\u002Fdiv>';\n      for (let d = 1; d <= daysInMonth; d++) {\n        const dateStr = year + '-' + String(month + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');\n        const dayBookings = state.bookings.filter(b => bookingDates(b).indexOf(dateStr) !== -1);\n        const isToday = today.getDate() === d && today.getMonth() === month && today.getFullYear() === year;\n        const ph = publicHoliday(dateStr);\n        const sch = schoolHoliday(dateStr);\n        const closed = isClosed(dateStr);\n        let tags = '';\n        if (closed) tags += '<div class=\"cal-tag cal-closed\">🔒 TUTUP<\u002Fdiv>';\n        if (ph) tags += `<div class=\"cal-tag cal-ph\" title=\"${ph}\">${ph}<\u002Fdiv>`;\n        else if (sch) tags += '<div class=\"cal-tag cal-sch\" title=\"' + sch + '\">Cuti Sekolah<\u002Fdiv>';\n        let dots = dayBookings.slice(0, 2).map(b =>\n          `<div class=\"cal-dot\" style=\"background:${STATUS_COLORS[b.status] || '#64748b'}\" onclick=\"event.stopPropagation();showCalDay('${dateStr}')\">${b.endDate ? '🚗 ' : ''}${b.name}<\u002Fdiv>`\n        ).join('');\n        if (dayBookings.length > 2) dots += `<div class=\"cal-more\">+${dayBookings.length - 2} more<\u002Fdiv>`;\n        const cls = 'cal-cell' + (isToday ? ' today' : '') + (closed ? ' is-closed' : (ph ? ' is-ph' : ''));\n        cells += `<div class=\"${cls}\" onclick=\"showCalDay('${dateStr}')\">\n          <div class=\"cal-date\">${d}<\u002Fdiv>${tags}${dots}<\u002Fdiv>`;\n      }\n      grid.innerHTML = cells;\n      renderMonthSummary(year, month);\n    }\n\n    function renderMonthSummary(year, month) {\n      const box = document.getElementById('cal-summary');\n      if (!box) return;\n      const BULAN = ['Januari', 'Februari', 'Mac', 'April', 'Mei', 'Jun', 'Julai', 'Ogos', 'September', 'Oktober', 'November', 'Disember'];\n      const mm = String(month + 1).padStart(2, '0');\n      const prefix = year + '-' + mm;\n\n      // Bookings yang jatuh dalam bulan ni (guna hari mula), bukan Enquiry/Cancelled\n      const monthBookings = state.bookings.filter(b => {\n        const d = (b.date || '').slice(0, 7);\n        return d === prefix && b.status !== 'Enquiry' && b.status !== 'Cancelled';\n      });\n      const siap = monthBookings.filter(isComplete).length;\n\n      // Tally ikut jenis servis (pecah \"A + B\" atau guna serviceItems)\n      const svcCount = {};\n      let bukaSeat = 0, tanpaBuka = 0;\n      monthBookings.forEach(b => {\n        let names = [];\n        if (Array.isArray(b.serviceItems) && b.serviceItems.length) names = b.serviceItems.map(x => x.name);\n        else if (b.service) names = String(b.service).split(' + ');\n        names.forEach(n => {\n          n = (n || '').trim(); if (!n) return;\n          svcCount[n] = (svcCount[n] || 0) + 1;\n          const low = n.toLowerCase();\n          if (low.includes('tanpa buka')) tanpaBuka++;\n          else if (low.includes('buka seat')) bukaSeat++;\n        });\n      });\n      const svcRows = Object.keys(svcCount).sort((a, b) => svcCount[b] - svcCount[a])\n        .map(n => '<div style=\"display:flex;justify-content:space-between;padding:4px 0;font-size:13px;\"><span style=\"color:#334155;\">' + n + '<\u002Fspan><span style=\"font-weight:700;color:#1f3d38;\">' + svcCount[n] + '<\u002Fspan><\u002Fdiv>').join('');\n\n      // Kedai tutup dalam bulan ni\n      const closedCount = (state.closedDates || []).filter(d => (d || '').slice(0, 7) === prefix).length;\n\n      // Pendapatan (booking siap) bulan ni\n      const income = monthBookings.filter(isComplete).reduce((s, b) => s + (b.price || 0), 0);\n      const material = monthBookings.filter(isComplete).reduce((s, b) => s + (b.material || 0), 0);\n      // Perbelanjaan bulan ni (dari Finance) — pisahkan Upah Pekerja\n      const monthExp = (state.expenses || []).filter(e => (e.date || '').slice(0, 7) === prefix);\n      const upah = monthExp.filter(e => e.category === 'Upah Pekerja').reduce((s, e) => s + (e.amount || 0), 0);\n      const kosLain = monthExp.filter(e => e.category !== 'Upah Pekerja').reduce((s, e) => s + (e.amount || 0), 0) + material;\n      const untungBersih = income - upah - kosLain;\n\n      const chip = (label, val, color) => '<div style=\"flex:1;min-width:0;background:' + color + '11;border:1px solid ' + color + '33;border-radius:10px;padding:10px;text-align:center;\">' +\n        '<div style=\"font-size:22px;font-weight:800;color:' + color + ';\">' + val + '<\u002Fdiv>' +\n        '<div style=\"font-size:11px;color:#64748b;font-weight:600;\">' + label + '<\u002Fdiv><\u002Fdiv>';\n\n      box.innerHTML = '<div class=\"fin-card\" style=\"margin-top:14px;\">' +\n        '<h3 style=\"font-size:15px;font-weight:800;color:#1f3d38;margin-bottom:12px;\">📊 Ringkasan ' + BULAN[month] + ' ' + year + '<\u002Fh3>' +\n        '<div style=\"display:flex;gap:8px;margin-bottom:12px;\">' +\n          chip('Jumlah Booking', monthBookings.length, '#4f46e5') +\n          chip('Siap', siap, '#0d9488') +\n          chip('Kedai Tutup', closedCount + ' hr', '#1f2937') +\n        '<\u002Fdiv>' +\n        '<div style=\"display:flex;gap:8px;margin-bottom:14px;\">' +\n          chip('Buka Seat', bukaSeat, '#dc2626') +\n          chip('Tanpa Buka Seat', tanpaBuka, '#3d8f82') +\n        '<\u002Fdiv>' +\n        (svcRows ? '<div style=\"border-top:1px solid #eef1f5;padding-top:10px;\"><div style=\"font-size:12px;font-weight:700;color:#94a3b8;margin-bottom:6px;\">PECAHAN SERVIS<\u002Fdiv>' + svcRows + '<\u002Fdiv>' : '<div style=\"text-align:center;color:#94a3b8;padding:8px;font-size:13px;\">Tiada booking bulan ni<\u002Fdiv>') +\n        '<div style=\"border-top:1px solid #eef1f5;margin-top:10px;padding-top:10px;\">' +\n          '<div style=\"font-size:12px;font-weight:700;color:#94a3b8;margin-bottom:6px;\">KIRA-KIRA BULAN INI<\u002Fdiv>' +\n          finRow('💰 Pendapatan (siap)', income, '#16a34a', false) +\n          finRow('👷 Upah Pekerja', upah, '#dc2626', true) +\n          finRow('🧪 Bahan & Kos Lain', kosLain, '#dc2626', true) +\n          '<div style=\"border-top:1.5px solid #e2e8f0;margin-top:8px;padding-top:8px;display:flex;justify-content:space-between;\">' +\n            '<span style=\"font-weight:800;color:#1f3d38;font-size:14px;\">📈 Untung Bersih<\u002Fspan>' +\n            '<span style=\"font-weight:800;color:' + (untungBersih >= 0 ? '#16a34a' : '#dc2626') + ';font-size:16px;\">RM' + untungBersih.toLocaleString() + '<\u002Fspan><\u002Fdiv>' +\n        '<\u002Fdiv>' +\n      '<\u002Fdiv>';\n    }\n\n    function finRow(label, val, color, isMinus) {\n      return '<div style=\"display:flex;justify-content:space-between;padding:3px 0;font-size:13px;\">' +\n        '<span style=\"color:#334155;\">' + label + '<\u002Fspan>' +\n        '<span style=\"font-weight:700;color:' + color + ';\">' + (isMinus && val > 0 ? '−RM' : 'RM') + val.toLocaleString() + '<\u002Fspan><\u002Fdiv>';\n    }\n\n    function showCalDay(dateStr) {\n      const dayBookings = state.bookings.filter(b => bookingDates(b).indexOf(dateStr) !== -1);\n      const detail = document.getElementById('cal-day-detail');\n      const ph = publicHoliday(dateStr);\n      const sch = schoolHoliday(dateStr);\n      const closed = isClosed(dateStr);\n      let head = '';\n      if (ph) head += '<div style=\"background:#fee2e2;color:#b91c1c;font-weight:700;font-size:13px;padding:8px 12px;border-radius:8px;margin-bottom:8px;\">🎉 ' + ph + ' (Cuti Umum)<\u002Fdiv>';\n      if (sch) head += '<div style=\"background:#ffedd5;color:#c2410c;font-weight:700;font-size:13px;padding:8px 12px;border-radius:8px;margin-bottom:8px;\">🎒 ' + sch + '<\u002Fdiv>';\n      const closeBtn = '<button onclick=\"toggleClosed(\\'' + dateStr + '\\')\" style=\"width:100%;padding:11px;border:none;border-radius:9px;background:' + (closed ? '#dc2626' : '#1f2937') + ';color:#fff;font-weight:700;font-size:13px;cursor:pointer;margin-bottom:10px;\">' + (closed ? '🔓 Buka Semula Kedai (' + formatDMY(dateStr) + ')' : '🔒 Tanda Kedai TUTUP hari ini') + '<\u002Fbutton>';\n      if (!dayBookings.length) {\n        detail.innerHTML = '<div class=\"fin-card\">' + head +\n          '<h3 style=\"font-size:15px;font-weight:700;color:#1f3d38;margin-bottom:10px;\">📅 ' + formatDMY(dateStr) + '<\u002Fh3>' +\n          closeBtn +\n          '<div style=\"color:#64748b;text-align:center;padding:6px;\">Tiada booking hari ini<\u002Fdiv><\u002Fdiv>';\n        return;\n      }\n      detail.innerHTML = '<div class=\"fin-card\">' + head +\n        '<h3 style=\"font-size:15px;font-weight:700;color:#1f3d38;margin-bottom:10px;\">📅 ' + formatDMY(dateStr) + ' (' + dayBookings.length + ')<\u002Fh3>' +\n        closeBtn +\n        dayBookings.sort((a, b) => (a.time || '').localeCompare(b.time || '')).map(b => {\n          const multi = b.endDate ? ' • 🚗 ' + bookingDates(b).length + ' hari (' + formatDMY(b.date) + '–' + formatDMY(b.endDate) + ')' : '';\n          return '<div class=\"fin-row\" style=\"align-items:flex-start;\">' +\n            '<div style=\"flex:1;cursor:pointer;\" onclick=\"showReceipt(\\'' + b.id + '\\')\">' +\n            '<div style=\"font-weight:700;color:#1f3d38;\">' + b.name + '<\u002Fdiv>' +\n            '<div style=\"font-size:12px;color:#64748b;\">' + (b.time || '—') + ' • ' + b.car + ' • ' + b.service + '<\u002Fdiv>' +\n            '<div style=\"font-size:11px;color:#3d8f82;font-weight:700;\">' + multi + '<\u002Fdiv>' +\n            '<\u002Fdiv>' +\n            '<div style=\"text-align:right;display:flex;flex-direction:column;gap:4px;align-items:flex-end;\">' +\n            '<span class=\"fin-cat-badge\" style=\"background:' + (STATUS_COLORS[b.status] || '#64748b') + ';color:#fff;\">' + b.status + '<\u002Fspan>' +\n            '<button onclick=\"setBookingDays(\\'' + b.id + '\\')\" style=\"background:#e0f2fe;color:#0369a1;border:none;border-radius:6px;padding:4px 8px;font-size:11px;font-weight:700;cursor:pointer;\">📅 Set Hari<\u002Fbutton>' +\n            '<\u002Fdiv><\u002Fdiv>';\n        }).join('') +\n      '<\u002Fdiv>';\n    }\n\n    /* ============ FINANCE ============ */\n    const CAT_COLORS = {\n      'Chemical/Stock': '#f59e0b', 'Marketing': '#c9863d', 'Overhead': '#8b5cf6',\n      'Equipment': '#10b981', 'Transport': '#ef4444', 'Upah Pekerja': '#3d8f82', 'Other': '#64748b'\n    };\n\n    async function saveExpense(e) {\n      e.preventDefault();\n      const expense = {\n        id: Date.now(),\n        category: document.getElementById('exp-category').value,\n        desc: document.getElementById('exp-desc').value,\n        amount: Number(document.getElementById('exp-amount').value),\n        date: document.getElementById('exp-date').value,\n        _synced: false,\n        createdAt: new Date().toISOString()\n      };\n      state.expenses.push(expense);\n      persistLocal();\n      renderAll();\n      document.querySelector('#finance form').reset();\n      expense._synced = await fbSet('expenses', expense.id, expense);\n      persistLocal();\n      updateSyncStatus();\n      alert('✅ Expense saved!');\n    }\n\n    // Bayar pekerja untuk hari ini (RM50 upah + RM10 makan = RM60), boleh ubah jumlah\n    async function payWorker() {\n      const now = new Date();\n      const dateStr = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');\n      const inp = prompt('Bayar pekerja untuk ' + formatDMY(dateStr) + '\\n\\nJumlah (RM50 upah + RM10 makan = RM60).\\nUbah jika perlu:', '60');\n      if (inp === null) return;\n      const amount = Number(inp);\n      if (!amount || amount <= 0) { alert('⚠️ Jumlah tak sah.'); return; }\n      const expense = {\n        id: Date.now(),\n        category: 'Upah Pekerja',\n        desc: (amount === 60 ? 'Upah RM50 + Makan RM10' : 'Upah Pekerja') + ' (1 hari)',\n        amount: amount,\n        date: dateStr,\n        _synced: false,\n        createdAt: new Date().toISOString()\n      };\n      state.expenses.push(expense);\n      persistLocal();\n      renderAll();\n      expense._synced = await fbSet('expenses', expense.id, expense);\n      persistLocal();\n      updateSyncStatus();\n      alert(expense._synced ? '✅ Bayaran pekerja RM' + amount + ' direkod untuk ' + formatDMY(dateStr) + '!' : '⚠️ Direkod dalam phone, akan auto-sync bila online.');\n    }\n\n    function deleteExpense(id) {\n      if (confirm('Delete this expense?')) {\n        state.expenses = state.expenses.filter(x => x.id != id);\n        persistLocal();\n        fbDelete('expenses', id);\n        renderAll();\n      }\n    }\n\n    function renderFinance() {\n      if (!document.getElementById('fin-revenue')) return;\n      // Auto-isi tarikh hari ni dalam borang (kau boleh ubah untuk back-dated)\n      const edEl = document.getElementById('exp-date');\n      if (edEl && !edEl.value) { const t = new Date(); edEl.value = t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0'); }\n      const exp = state.expenses || [];\n      const revenue = state.bookings.filter(isComplete).reduce((s, b) => s + (b.price || 0), 0);\n      const material = state.bookings.filter(isComplete).reduce((s, b) => s + (b.material || 0), 0);\n      const totalExp = exp.reduce((s, e) => s + (e.amount || 0), 0);\n      const chemical = exp.filter(e => e.category === 'Chemical/Stock').reduce((s, e) => s + (e.amount || 0), 0);\n      const net = revenue - material - totalExp;\n\n      document.getElementById('fin-revenue').textContent = 'RM' + revenue.toLocaleString();\n      document.getElementById('fin-expenses').textContent = 'RM' + totalExp.toLocaleString();\n      document.getElementById('fin-chemical').textContent = 'RM' + chemical.toLocaleString();\n      document.getElementById('fin-netprofit').textContent = 'RM' + net.toLocaleString();\n\n      const list = document.getElementById('expense-list');\n      if (!exp.length) {\n        list.innerHTML = '<div style=\"text-align:center;color:#94a3b8;padding:16px;\">Tiada perbelanjaan direkod lagi<\u002Fdiv>';\n      } else {\n        const BULAN = ['Januari', 'Februari', 'Mac', 'April', 'Mei', 'Jun', 'Julai', 'Ogos', 'September', 'Oktober', 'November', 'Disember'];\n        const groups = {};\n        exp.forEach(e => { const mk = (e.date || '').slice(0, 7) || '0000-00'; (groups[mk] = groups[mk] || []).push(e); });\n        const monthKeys = Object.keys(groups).sort((a, b) => b.localeCompare(a));\n        list.innerHTML = monthKeys.map(mk => {\n          const items = groups[mk].slice().sort((a, b) => new Date(b.date) - new Date(a.date));\n          const monthTotal = items.reduce((s, e) => s + (e.amount || 0), 0);\n          let label = mk;\n          if (/^\\d{4}-\\d{2}$/.test(mk)) { const parts = mk.split('-'); label = (BULAN[Number(parts[1]) - 1] || '?') + ' ' + parts[0]; }\n          const header = '<div style=\"display:flex;justify-content:space-between;align-items:center;background:#eef2f7;padding:9px 12px;border-radius:9px;margin:16px 0 8px;\">' +\n            '<span style=\"font-weight:800;color:#1f3d38;font-size:14px;\">📅 ' + label + '<\u002Fspan>' +\n            '<span style=\"font-weight:800;color:#dc2626;font-size:14px;\">RM' + monthTotal.toLocaleString() + '<\u002Fspan><\u002Fdiv>';\n          const rows = items.map(e => `\n        <div class=\"fin-row\">\n          <div>\n            <span class=\"fin-cat-badge\" style=\"background:${CAT_COLORS[e.category] || '#64748b'};color:#fff;\">${e.category}<\u002Fspan>\n            <div style=\"font-weight:600;color:#1f3d38;margin-top:4px;\">${e.desc}<\u002Fdiv>\n            <div style=\"font-size:11px;color:#94a3b8;\">${formatDMY(e.date)}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"text-align:right;display:flex;align-items:center;gap:10px;\">\n            <div style=\"font-weight:700;color:#dc2626;\">RM${(e.amount || 0).toLocaleString()}<\u002Fdiv>\n            <button onclick=\"deleteExpense('${e.id}')\" style=\"background:none;border:none;cursor:pointer;font-size:16px;\">🗑️<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>`).join('');\n          return header + rows;\n        }).join('');\n      }\n\n      renderFinCharts();\n\n      // Text breakdown by category (never blank — works even without Chart.js)\n      const bd = document.getElementById('expense-breakdown');\n      if (bd) {\n        const cats = {};\n        exp.forEach(e => { cats[e.category] = (cats[e.category] || 0) + (e.amount || 0); });\n        const catKeys = Object.keys(cats).sort((a, b) => cats[b] - cats[a]);\n        if (!catKeys.length || totalExp === 0) {\n          bd.innerHTML = '<div style=\"text-align:center;color:#94a3b8;padding:16px;\">Tiada perbelanjaan direkod lagi<\u002Fdiv>';\n          const wrap = document.getElementById('finPie-wrap'); if (wrap) wrap.style.display = 'none';\n        } else {\n          const wrap = document.getElementById('finPie-wrap'); if (wrap) wrap.style.display = '';\n          bd.innerHTML = catKeys.map(c => {\n            const amt = cats[c]; const pct = Math.round((amt / totalExp) * 100);\n            const color = CAT_COLORS[c] || '#64748b';\n            return '<div style=\"margin-bottom:10px;\">' +\n              '<div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;\">' +\n              '<span style=\"font-weight:600;color:#1f3d38;font-size:13px;\"><span style=\"display:inline-block;width:10px;height:10px;border-radius:3px;background:' + color + ';margin-right:6px;\"><\u002Fspan>' + c + '<\u002Fspan>' +\n              '<span style=\"font-weight:700;color:#dc2626;font-size:13px;\">RM' + amt.toLocaleString() + ' <span style=\"color:#94a3b8;font-weight:600;\">(' + pct + '%)<\u002Fspan><\u002Fspan>' +\n              '<\u002Fdiv>' +\n              '<div style=\"background:#f1f5f9;border-radius:6px;height:8px;overflow:hidden;\"><div style=\"height:100%;width:' + pct + '%;background:' + color + ';\"><\u002Fdiv><\u002Fdiv>' +\n              '<\u002Fdiv>';\n          }).join('');\n        }\n      }\n    }\n\n    function renderFinCharts() {\n      if (typeof Chart === 'undefined') return;\n      const now = new Date();\n      const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];\n      const labels = [], revData = [], expData = [];\n      for (let i = 5; i >= 0; i--) {\n        const ref = new Date(now.getFullYear(), now.getMonth() - i, 1);\n        labels.push(months[ref.getMonth()]);\n        revData.push(state.bookings.filter(b => isComplete(b) && monthMatch(b.date, ref)).reduce((s, b) => s + (b.price || 0), 0));\n        expData.push((state.expenses || []).filter(e => monthMatch(e.date, ref)).reduce((s, e) => s + (e.amount || 0), 0));\n      }\n      const barCtx = document.getElementById('finChart');\n      if (barCtx) {\n        if (finChart && finChart.destroy) finChart.destroy();\n        finChart = new Chart(barCtx, {\n          type: 'bar',\n          data: { labels, datasets: [\n            { label: 'Revenue', data: revData, backgroundColor: '#10b981', borderRadius: 6 },\n            { label: 'Expenses', data: expData, backgroundColor: '#ef4444', borderRadius: 6 }\n          ]},\n          options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } }, scales: { y: { beginAtZero: true } } }\n        });\n      }\n      const cats = {};\n      (state.expenses || []).forEach(e => { cats[e.category] = (cats[e.category] || 0) + (e.amount || 0); });\n      const catLabels = Object.keys(cats);\n      const pieCtx = document.getElementById('finPie');\n      if (pieCtx) {\n        if (finPie && finPie.destroy) finPie.destroy();\n        if (catLabels.length) {\n          finPie = new Chart(pieCtx, {\n            type: 'doughnut',\n            data: { labels: catLabels, datasets: [{ data: catLabels.map(c => cats[c]), backgroundColor: catLabels.map(c => CAT_COLORS[c] || '#64748b') }] },\n            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }\n          });\n        }\n      }\n    }\n  <\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
