e=\"1:30 PM\">1:30 PM<\u002Foption>\n                  <option value=\"2:00 PM\">2:00 PM<\u002Foption>\n                  <option value=\"2:30 PM\">2:30 PM<\u002Foption>\n                  <option value=\"3:00 PM\">3:00 PM<\u002Foption>\n                  <option value=\"3:30 PM\">3:30 PM<\u002Foption>\n                  <option value=\"4:00 PM\">4:00 PM<\u002Foption>\n                  <option value=\"4:30 PM\">4:30 PM<\u002Foption>\n                  <option value=\"5:00 PM\">5:00 PM<\u002Foption>\n                  <option value=\"5:30 PM\">5:30 PM<\u002Foption>\n                  <option value=\"6:00 PM\">6:00 PM<\u002Foption>\n                <\u002Fselect>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"form-row\" style=\"margin-top:12px;\">\n              <div>\n                <label>🚗 Berapa hari kereta di kedai?<\u002Flabel>\n                <select id=\"days-at-shop\">\n                  <option value=\"1\">1 hari (sehari sahaja)<\u002Foption>\n                  <option value=\"2\">2 hari<\u002Foption>\n                  <option value=\"3\">3 hari<\u002Foption>\n                  <option value=\"4\">4 hari<\u002Foption>\n                  <option value=\"5\">5 hari<\u002Foption>\n                  <option value=\"6\">6 hari<\u002Foption>\n                  <option value=\"7\">7 hari<\u002Foption>\n                <\u002Fselect>\n              <\u002Fdiv>\n              <div><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <!-- Services & Pricing (checklist) -->\n          <div class=\"form-section\">\n            <div class=\"form-section-title\">🔧 Servis &amp; Harga *<\u002Fdiv>\n            <div style=\"font-size: 12px; color: #94a3b8; margin-top: -6px;\">Tick servis yang dipilih, isi harga di sebelah<\u002Fdiv>\n            <div id=\"service-checklist\" style=\"border: 1px solid #e2e8f0; border-radius: 10px; overflow: hidden; max-height: 340px; overflow-y: auto;\"><\u002Fdiv>\n\n            <!-- Summary Box -->\n            <div style=\"background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 10px; padding: 16px;\">\n              <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;\">\n                <span style=\"font-weight: 600; color: #1e3a5f;\">Jumlah Servis<\u002Fspan>\n                <span id=\"form-total\" style=\"font-weight: 800; color: #1f3d38; font-size: 18px;\">RM 0<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;\">\n                <span style=\"font-weight: 600; color: #1e3a5f;\">Deposit Diterima<\u002Fspan>\n                <input type=\"number\" id=\"deposit\" placeholder=\"0\" oninput=\"recalcBalance()\" style=\"width: 120px; padding: 8px; border: 1px solid #bfdbfe; border-radius: 6px; text-align: right; font-size: 16px;\">\n              <\u002Fdiv>\n              <div style=\"display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #bfdbfe; padding-top: 10px;\">\n                <span style=\"font-weight: 700; color: #1e3a5f;\">Baki<\u002Fspan>\n                <span id=\"form-balance\" style=\"font-weight: 800; color: #dc2626; font-size: 16px;\">RM 0<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <!-- Lain-lain -->\n          <div class=\"form-section\">\n            <div class=\"form-section-title\">📝 Lain-lain<\u002Fdiv>\n            <div>\n              <label>Material Cost (RM)<\u002Flabel>\n              <input type=\"number\" id=\"material\" placeholder=\"0\">\n            <\u002Fdiv>\n            <div>\n              <label>Notes<\u002Flabel>\n              <textarea id=\"notes\" placeholder=\"Sebarang nota...\" style=\"height: 80px;\"><\u002Ftextarea>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <!-- Hidden fields populated on save -->\n          <input type=\"hidden\" id=\"service\">\n          <input type=\"hidden\" id=\"price\">\n\n          <button type=\"submit\" id=\"save-booking-btn\" class=\"form-submit-btn\">💾 Save Booking<\u002Fbutton>\n        <\u002Fform>\n      <\u002Fsection>\n\n      <!-- Receipt -->\n      <section id=\"receipt\" class=\"page\">\n        <h2 class=\"section-title\">Receipt<\u002Fh2>\n        <div id=\"receipt-content\"><\u002Fdiv>\n        <div style=\"text-align: center; margin-top: 20px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;\">\n          <button onclick=\"shareToWhatsApp()\" class=\"btn\" style=\"background: #25D366; color: white; padding: 12px 24px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; flex: 1; min-width: 120px;\">💬 WhatsApp<\u002Fbutton>\n          <button onclick=\"savePDF()\" class=\"btn\" style=\"background: #FF6B6B; color: white; padding: 12px 24px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; flex: 1; min-width: 120px;\">📄 Save PDF<\u002Fbutton>\n          <button onclick=\"printReceipt()\" class=\"print-btn\" style=\"background: #4A90E2; color: white; padding: 12px 24px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; flex: 1; min-width: 120px;\">🖨️ Print<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- Calendar -->\n      <section id=\"calendar\" class=\"page\">\n        <h2 class=\"section-title\">Calendar<\u002Fh2>\n        <p class=\"section-subtitle\">All orders by date<\u002Fp>\n        <div class=\"fin-card\">\n          <div class=\"cal-head\">\n            <button class=\"cal-nav-btn\" onclick=\"changeMonth(-1)\">‹<\u002Fbutton>\n            <div class=\"cal-month\" id=\"cal-month-label\">—<\u002Fdiv>\n            <button class=\"cal-nav-btn\" onclick=\"changeMonth(1)\">›<\u002Fbutton>\n          <\u002Fdiv>\n          <div class=\"cal-grid\" id=\"cal-dow-row\"><\u002Fdiv>\n          <div class=\"cal-grid\" id=\"cal-grid\" style=\"margin-top: 5px;\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div id=\"cal-summary\"><\u002Fdiv>\n        <div id=\"cal-day-detail\"><\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- Finance -->\n      <section id=\"finance\" class=\"page\">\n        <h2 class=\"section-title\">Finance<\u002Fh2>\n        <p class=\"section-subtitle\">Business report, expenses &amp; profit<\u002Fp>\n\n        <div class=\"kpi-grid\" style=\"grid-template-columns: repeat(2,1fr);\">\n          <div class=\"kpi-card revenue\">\n            <div class=\"kpi-icon\">💰<\u002Fdiv>\n            <div class=\"kpi-value\" id=\"fin-revenue\" style=\"font-size:20px;\">RM0<\u002Fdiv>\n            <div class=\"kpi-label\">Revenue<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"kpi-card overhead\">\n            <div class=\"kpi-icon\">💸<\u002Fdiv>\n            <div class=\"kpi-value\" id=\"fin-expenses\" style=\"font-size:20px;\">RM0<\u002Fdiv>\n            <div class=\"kpi-label\">Total Expenses<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"kpi-card cost\">\n            <div class=\"kpi-icon\">🧪<\u002Fdiv>\n            <div class=\"kpi-value\" id=\"fin-chemical\" style=\"font-size:20px;\">RM0<\u002Fdiv>\n            <div class=\"kpi-label\">Chemical / Stock<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"kpi-card profit\">\n            <div class=\"kpi-icon\">📈<\u002Fdiv>\n            <div class=\"kpi-value\" id=\"fin-netprofit\" style=\"font-size:20px;\">RM0<\u002Fdiv>\n            <div class=\"kpi-label\">Net Profit<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <button onclick=\"payWorker()\" style=\"width:100%;padding:13px;border:none;border-radius:11px;background:linear-gradient(135deg,#3d8f82,#2f6e64);color:#fff;font-weight:800;font-size:14px;cursor:pointer;margin-bottom:16px;box-shadow:0 2px 8px rgba(14,165,233,.25);\">👷 Bayar Pekerja Hari Ni (RM60)<\u002Fbutton>\n\n        <div class=\"fin-card\">\n          <h3 style=\"font-size:15px;font-weight:700;color:#1f3d38;margin-bottom:12px;\">Revenue vs Expenses (6 months)<\u002Fh3>\n          <div class=\"chart-wrap\"><canvas id=\"finChart\"><\u002Fcanvas><\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"fin-card\">\n          <h3 style=\"font-size:15px;font-weight:700;color:#1f3d38;margin-bottom:12px;\">Expense Breakdown<\u002Fh3>\n          <div id=\"expense-breakdown\"><\u002Fdiv>\n          <div class=\"chart-wrap\" id=\"finPie-wrap\" style=\"margin-top:12px;\"><canvas id=\"finPie\"><\u002Fcanvas><\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"fin-card\">\n          <h3 style=\"font-size:15px;font-weight:700;color:#1f3d38;margin-bottom:12px;\">+ Add Expense<\u002Fh3>\n          <form onsubmit=\"saveExpense(event)\" class=\"form-group\">\n            <div>\n              <label>Category *<\u002Flabel>\n              <select id=\"exp-category\" required=\"\" style=\"width:100%;padding:10px;border:1px solid #ddd;border-radius:6px;\">\n                <option value=\"Chemical/Stock\">🧪 Chemical / Stock<\u002Foption>\n                <option value=\"Upah Pekerja\">👷 Upah Pekerja<\u002Foption>\n                <option value=\"Marketing\">📢 Marketing / Ads<\u002Foption>\n                <option value=\"Overhead\">🏢 Overhead (rent, utilities)<\u002Foption>\n                <option value=\"Equipment\">🔧 Equipment<\u002Foption>\n                <option value=\"Transport\">⛽ Transport / Petrol<\u002Foption>\n                <option value=\"Other\">📦 Other<\u002Foption>\n              <\u002Fselect>\n            <\u002Fdiv>\n            <div>\n              <label>Description *<\u002Flabel>\n              <input type=\"text\" id=\"exp-desc\" placeholder=\"e.g., Shampoo 5L, Facebook Ads\" required=\"\">\n            <\u002Fdiv>\n            <div>\n              <label>Amount (RM) *<\u002Flabel>\n              <input type=\"number\" id=\"exp-amount\" placeholder=\"0\" step=\"0.01\" required=\"\">\n            <\u002Fdiv>\n            <div>\n              <label>Date *<\u002Flabel>\n              <input type=\"date\" id=\"exp-date\" required=\"\">\n            <\u002Fdiv>\n            <button type=\"submit\" class=\"btn btn-whatsapp\">Save Expense<\u002Fbutton>\n          <\u002Fform>\n        <\u002Fdiv>\n\n        <div class=\"fin-card\">\n          <h3 style=\"font-size:15px;font-weight:700;color:#1f3d38;margin-bottom:6px;\">Expense History<\u002Fh3>\n          <div id=\"expense-list\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fdiv>\n\n    <!-- Bottom Navigation -->\n    <div class=\"bottom-nav\">\n      <button class=\"nav-item active\" onclick=\"goToPage('dashboard')\">\n        <div class=\"nav-icon\">📊<\u002Fdiv>\n        <div class=\"nav-label\">Dashboard<\u002Fdiv>\n      <\u002Fbutton>\n      <button class=\"nav-item\" onclick=\"newBooking()\">\n        <div class=\"nav-icon\">➕<\u002Fdiv>\n        <div class=\"nav-label\">Add<\u002Fdiv>\n      <\u002Fbutton>\n      <button class=\"nav-item\" onclick=\"goToPage('calendar')\">\n        <div class=\"nav-icon\">📅<\u002Fdiv>\n        <div class=\"nav-label\">Calendar<\u002Fdiv>\n      <\u002Fbutton>\n      <button class=\"nav-item\" onclick=\"goToPage('bookings')\">\n        <div class=\"nav-icon\">📋<\u002Fdiv>\n        <div class=\"nav-label\">Bookings<\u002Fdiv>\n      <\u002Fbutton>\n      <button class=\"nav-item\" onclick=\"goToPage('finance')\">\n        <div class=\"nav-icon\">💰<\u002Fdiv>\n        <div class=\"nav-label\">Finance<\u002Fdiv>\n      <\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <script>\n    const STORE_KEY = 'cuciSeatAdmin.bookings.v1';\n    const EXP_KEY = 'cuciSeatAdmin.expenses.v1';\n    let state = { bookings: [], expenses: [], closedDates: [] };\n    let currentReceiptId = null;\n    let editingBookingId = null;\n    let calMonth = new Date();\n\n    // Senarai servis (latest)\n    const DEFAULT_SERVICES = [\n      'Cuci Semua Seat (Tanpa Buka Seat)',\n      'Cuci Semua Seat (Buka Seat)',\n      'Leather Seat Cleaning (Tanpa Buka Seat)',\n      'Leather Seat Cleaning (Buka Seat)',\n      'Cuci Satu Seat Sahaja (Tanpa Buka Seat)',\n      'Cuci Satu Seat Sahaja (Buka Seat)',\n      'Cuci Bumbung Kereta',\n      'Cuci Carpet Lantai',\n      'Cuci Carpet Lantai (Satu Bahagian Sahaja)',\n      'Cuci Carpet Kaki',\n      'Cuci Dashboard & Console Tengah',\n      'Cuci Door Panel',\n      'Cuci Seat Belt',\n      'Cuci Boot Belakang',\n      'Cuci Frame Body Kereta',\n      'Interior Wax',\n      'Odor Treatment',\n      'Sanitize Dalaman Kereta',\n      'Steam Cleaning (For Deep Cleaning)'\n    ];\n    let finChart = null, finPie = null;\n\n    // ===== Firebase Auth Login =====\n    let appStarted = false;\n    let authMode = 'login';\n\n    function showSignupMode() {\n      authMode = 'signup';\n      document.getElementById('auth-title').textContent = 'Daftar Akaun Admin';\n      document.getElementById('auth-subtitle').textContent = 'Cipta akaun (kali pertama sahaja)';\n      document.getElementById('login-btn').textContent = 'Daftar';\n      document.getElementById('login-error').textContent = '';\n      document.getElementById('auth-switch-signup').style.display = 'none';\n      document.getElementById('auth-switch-login').style.display = 'inline';\n    }\n    function showLoginMode() {\n      authMode = 'login';\n      document.getElementById('auth-title').textContent = 'Admin Login';\n      document.getElementById('auth-subtitle').textContent = 'Masukkan email & password admin';\n      document.getElementById('login-btn').textContent = 'Log Masuk';\n      document.getElementById('login-error').textContent = '';\n      document.getElementById('auth-switch-signup').style.display = 'inline';\n      document.getElementById('auth-switch-login').style.display = 'none';\n    }\n    function authSubmit() { if (authMode === 'signup') doSignup(); else doLogin(); }\n\n    function doLogin() {\n      const email = document.getElementById('login-email').value.trim();\n      const pass = document.getElementById('login-password').value;\n      const errEl = document.getElementById('login-error');\n      const btn = document.getElementById('login-btn');\n      errEl.textContent = '';\n      if (!email || !pass) { errEl.textContent = 'Sila isi email & password.'; return; }\n      if (typeof firebase === 'undefined' || !firebase.auth) { errEl.textContent = 'Tiada sambungan. Cuba lagi.'; return; }\n      btn.textContent = 'Sedang log masuk...'; btn.disabled = true;\n      firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL)\n        .then(() => firebase.auth().signInWithEmailAndPassword(email, pass))\n        .catch((err) => {\n          btn.textContent = 'Log Masuk'; btn.disabled = false;\n          const code = err && err.code ? err.code : '';\n          if (code === 'auth/invalid-email') errEl.textContent = 'Email tak sah.';\n          else if (code === 'auth/user-not-found' || code === 'auth/wrong-password' || code === 'auth/invalid-credential') errEl.textContent = 'Email atau password salah. (Kali pertama? Tekan Daftar di bawah.)';\n          else if (code === 'auth/too-many-requests') errEl.textContent = 'Terlalu banyak cubaan. Cuba sekejap lagi.';\n          else if (code === 'auth/operation-not-allowed') errEl.textContent = 'Email/Password belum diaktifkan dalam Firebase. (Lihat arahan.)';\n          else errEl.textContent = 'Gagal log masuk: ' + (err && err.message ? err.message : code);\n        });\n    }\n\n    function doSignup() {\n      const email = document.getElementById('login-email').value.trim();\n      const pass = document.getElementById('login-password').value;\n      const errEl = document.getElementById('login-error');\n      const btn = document.getElementById('login-btn');\n      errEl.textContent = '';\n      if (!email || !pass) { errEl.textContent = 'Sila isi email & password.'; return; }\n      if (pass.length < 6) { errEl.textContent = 'Password mesti sekurang-kurangnya 6 aksara.'; return; }\n      if (typeof firebase === 'undefined' || !firebase.auth) { errEl.textContent = 'Tiada sambungan. Cuba lagi.'; return; }\n      btn.textContent = 'Sedang daftar...'; btn.disabled = true;\n      firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL)\n        .then(() => firebase.auth().createUserWithEmailAndPassword(email, pass))\n        .then((cred) => {\n          const uid = cred.user.uid;\n          localStorage.setItem('myAdminUid', uid);\n          alert('✅ Akaun berjaya dicipta & log masuk!\\n\\n🔑 UID kau:\\n' + uid + '\\n\\nSALIN UID ni untuk update Firestore Rules.\\nKau juga boleh lihat semula di Dashboard → butang \"🔑 UID Saya\".');\n        })\n        .catch((err) => {\n          btn.textContent = 'Daftar'; btn.disabled = false;\n          const code = err && err.code ? err.code : '';\n          if (code === 'auth/email-already-in-use') errEl.textContent = 'Email ni dah ada akaun. Tekan \"Log masuk\" di bawah.';\n          else if (code === 'auth/invalid-email') errEl.textContent = 'Email tak sah.';\n          else if (code === 'auth/weak-password') errEl.textContent = 'Password terlalu lemah (guna 6+ aksara).';\n          else if (code === 'auth/operation-not-allowed') errEl.textContent = 'Email/Password belum diaktifkan dalam Firebase Console. Aktifkan dulu (lihat arahan).';\n          else errEl.textContent = 'Gagal daftar: ' + (err && err.message ? err.message : code);\n        });\n    }\n\n    function showMyUID() {\n      const u = (typeof firebase !== 'undefined' && firebase.auth && firebase.auth().currentUser) ? firebase.auth().currentUser : null;\n      const uid = u ? u.uid : (localStorage.getItem('myAdminUid') || '(tiada)');\n      const email = u ? u.email : '';\n      alert('🔑 UID Admin kau:\\n\\n' + uid + '\\n\\nEmail: ' + email + '\\n\\nGuna UID ni dalam Firestore Rules (ganti UID_KAU_DI_SINI).');\n    }\n\n    function showLoginScreen() {\n      document.getElementById('pin-modal').style.display = 'flex';\n      document.getElementById('app-main').style.display = 'none';\n      const btn = document.getElementById('login-btn'); if (btn) { btn.textContent = 'Log Masuk'; btn.disabled = false; }\n    }\n\n    // Login bila tekan Enter\n    document.getElementById('login-password').addEventListener('keypress', (e) => { if (e.key === 'Enter') doLogin(); });\n    document.getElementById('login-email').addEventListener('keypress', (e) => { if (e.key === 'Enter') document.getElementById('login-password').focus(); });\n\n    // Pantau status login — kekal log masuk merentas buka/tutup app\n    if (typeof firebase !== 'undefined' && firebase.auth) {\n      firebase.auth().onAuthStateChanged((user) => {\n        if (user) {\n          document.getElementById('pin-modal').style.display = 'none';\n          document.getElementById('app-main').style.display = 'block';\n          document.getElementById('login-password').value = '';\n          if (!appStarted) { appStarted = true; initApp(); }\n        } else {\n          showLoginScreen();\n          document.getElementById('login-email').focus();\n        }\n      });\n    } else {\n      showLoginScreen();\n    }\n\n    // Init\n    function initApp() {\n      loadData();\n      updateClock();\n      setInterval(updateClock, 1000);\n      // Build the service checklist in the add form\n      buildServiceChecklist([]);\n      // Auto-retry sync bila internet kembali / berkala\n      window.addEventListener('online', () => { console.log('🌐 Online — cuba sync'); syncPending(false); });\n      setInterval(() => { if (countPending() > 0) syncPending(false); }, 20000);\n      // Notifikasi enquiry baru (real-time)\n      setupEnquiryWatch();\n      if ('Notification' in window && Notification.permission === 'default') {\n        setTimeout(() => { try { Notification.requestPermission(); } catch (e) {} }, 1500);\n      }\n    }\n\n    // ===== Notifikasi Enquiry Baru =====\n    let knownEnquiryIds = null;\n    let audioCtx = null;\n    function beep() {\n      try {\n        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();\n        if (audioCtx.state === 'suspended') audioCtx.resume();\n        const now = audioCtx.currentTime;\n        [0, 0.18].forEach(off => {\n          const o = audioCtx.createOscillator(); const g = audioCtx.createGain();\n          o.connect(g); g.connect(audioCtx.destination);\n          o.type = 'sine'; o.frequency.value = 880;\n          g.gain.setValueAtTime(0.0001, now + off);\n          g.gain.exponentialRampToValueAtTime(0.35, now + off + 0.02);\n          g.gain.exponentialRampToValueAtTime(0.0001, now + off + 0.15);\n          o.start(now + off); o.stop(now + off + 0.16);\n        });\n      } catch (e) {}\n    }\n    function showEnquiryToast(b) {\n      let t = document.getElementById('enquiry-toast');\n      if (!t) { t = document.createElement('div'); t.id = 'enquiry-toast'; document.body.appendChild(t); }\n      t.onclick = () => { goToPage('dashboard'); filterByStatus('Enquiry'); t.remove(); };\n      t.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:#7c3aed;color:#fff;padding:14px 16px;font-weight:700;text-align:center;cursor:pointer;box-shadow:0 3px 12px rgba(0,0,0,.25);';\n      t.textContent = '🔔 Enquiry baru: ' + b.name + (b.car ? ' (' + b.car + ')' : '') + ' — tap untuk lihat';\n      clearTimeout(t._timer);\n      t._timer = setTimeout(() => { const el = document.getElementById('enquiry-toast'); if (el) el.remove(); }, 9000);\n    }\n    function notifyNewEnquiry(b) {\n      beep();\n      showEnquiryToast(b);\n      if ('Notification' in window && Notification.permission === 'granted') {\n        try {\n          const n = new Notification('🔔 Enquiry Baru — Cuci Seat Kereta', {\n            body: b.name + (b.car ? ' • ' + b.car : '') + (b.phone ? '\\n📞 ' + b.phone : ''),\n            tag: 'enq-' + b.id\n          });\n          n.onclick = () => { window.focus(); goToPage('dashboard'); filterByStatus('Enquiry'); n.close(); };\n        } catch (e) {}\n      }\n    }\n    function setupEnquiryWatch() {\n      if (!fbReady()) return;\n      try {\n        firebase.firestore().collection('bookings').onSnapshot((snap) => {\n          const enquiryIds = []; const newOnes = []; const fbBookings = [];\n          snap.forEach((doc) => {\n            const data = Object.assign({ id: doc.id }, doc.data(), { _synced: true });\n            normalizeBooking(data);\n            fbBookings.push(data);\n            if (data.status === 'Enquiry') {\n              enquiryIds.push(String(doc.id));\n              if (knownEnquiryIds && !knownEnquiryIds.has(String(doc.id))) newOnes.push(data);\n            }\n          });\n          // live-update senarai (kekalkan rekod local yang belum sync)\n          const fbIds = new Set(fbBookings.map(x => String(x.id)));\n          const localOnly = state.bookings.filter(x => !fbIds.has(String(x.id)) && x._synced === false);\n          state.bookings = fbBookings.concat(localOnly);\n          persistLocal();\n          renderAll();\n          if (knownEnquiryIds === null) { knownEnquiryIds = new Set(enquiryIds); }\n          else { newOnes.forEach(notifyNewEnquiry); enquiryIds.forEach(id => knownEnquiryIds.add(id)); }\n        }, (err) => console.warn('enquiry watch:', err && err.message));\n      } catch (e) { console.warn('enquiry watch setup', e); }\n    }\n    function enableNotifications() {\n      if (!('Notification' in window)) { alert('Browser ni tak sokong notifikasi.'); return; }\n      Notification.requestPermission().then((perm) => {\n        beep(); // unlock audio + test bunyi\n        if (perm === 'granted') alert('✅ Notifikasi dihidupkan! Kau akan dapat alert + bunyi bila ada enquiry baru (semasa app terbuka).');\n        else alert('⚠️ Notifikasi tak dibenarkan. Kau masih dapat banner + bunyi dalam app. Untuk hidupkan, benarkan notifikasi dalam tetapan browser.');\n      }).catch(() => {});\n    }\n\n    // chart.js dimuat secara defer — bila siap, lukis semula carta\n    window.addEventListener('load', () => {\n      if (typeof Chart !== 'undefined' && document.getElementById('app-main') && document.getElementById('app-main').style.display !== 'none') {\n        try { renderAll(); } catch (e) {}\n      }\n    });\n\n    // Firebase helpers (best-effort, never block UI)\n    function fbReady() { return typeof firebase !== 'undefined' && firebase.firestore; }\n    async function fbSet(coll, id, data) {\n      if (!fbReady()) return false;\n      try {\n        // Buang flag dalaman (mula dengan _) supaya dokumen cloud bersih\n        const clean = {};\n        for (const k in data) { if (!k.startsWith('_')) clean[k] = data[k]; }\n        await firebase.firestore().collection(coll).doc(String(id)).set(clean);\n        return true;\n      } catch (e) { console.error('fbSet error', e); return false; }\n    }\n    async function fbDelete(coll, id) {\n      if (!fbReady()) return;\n      try { await firebase.firestore().collection(coll).doc(String(id)).delete(); }\n      catch (e) { console.error('fbDelete error', e); }\n    }\n\n    // Load: show cached data instantly, then refresh from Firebase\n    async function loadData() {\n      // 1) Seed from localStorage first so dashboard is never empty\n      try {\n        const s = localStorage.getItem(STORE_KEY);\n        if (s) { const p = JSON.parse(s); state.bookings = Array.isArray(p) ? p : (p.bookings || []); }\n      } catch (e) { console.error('cache bookings parse', e); }\n      state.bookings.forEach(normalizeBooking); // fix legacy statuses in cache too\n      try {\n        const se = localStorage.getItem(EXP_KEY);\n        if (se) { const p = JSON.parse(se); state.expenses = Array.isArray(p) ? p : (p.expenses || []); }\n      } catch (e) { console.error('cache expenses parse', e); }\n      try {\n        const sc = localStorage.getItem('cuci_closed');\n        if (sc) { const p = JSON.parse(sc); state.closedDates = (p && p.dates) || []; }\n      } catch (e) { state.closedDates = state.closedDates || []; }\n      renderAll();\n\n      // 2) Overlay live data from Firebase (MERGE, never blindly overwrite cache)\n      if (fbReady()) {\n        // Tunjuk penanda \"memuatkan\" supaya 0 sekejap tak nampak macam data hilang\n        const _b = document.getElementById('sync-banner');\n        if (_b) { _b.style.display = 'block'; _b.style.background = '#dbeafe'; _b.style.color = '#1e40af'; _b.textContent = '🔄 Memuatkan data terkini dari cloud...'; }\n        try {\n          const bSnap = await firebase.firestore().collection('bookings').get({ source: 'server' });\n          const fbBookings = bSnap.docs.map(doc => ({ id: doc.id, ...doc.data(), _synced: true }));\n          // Fix legacy records (e.g. status \"Confirmed\") so they appear & count correctly\n          fbBookings.forEach(b => { if (normalizeBooking(b)) fbSet('bookings', b.id, b); });\n          const fbIds = new Set(fbBookings.map(b => String(b.id)));\n\n          // Any local record NOT in Firebase = write yang gagal naik dulu.\n          // Jangan buang — simpan & cuba hantar semula (auto re-sync).\n          const localOnly = state.bookings.filter(b => !fbIds.has(String(b.id)) && !b._deleted)\n            .map(b => ({ ...b, _synced: false }));\n\n          state.bookings = [...fbBookings, ...localOnly];\n          localStorage.setItem(STORE_KEY, JSON.stringify({ bookings: state.bookings }));\n          console.log('✅ Loaded', fbBookings.length, 'from Firebase +', localOnly.length, 'pending re-sync');\n        } catch (err) { console.error('Firebase bookings load failed (keeping cache):', err); }\n        try {\n          const eSnap = await firebase.firestore().collection('expenses').get({ source: 'server' });\n          const fbExp = eSnap.docs.map(doc => ({ id: doc.id, ...doc.data(), _synced: true }));\n          const eIds = new Set(fbExp.map(e => String(e.id)));\n          const expOnly = (state.expenses || []).filter(e => !eIds.has(String(e.id)) && !e._deleted)\n            .map(e => ({ ...e, _synced: false }));\n          state.expenses = [...fbExp, ...expOnly];\n          localStorage.setItem(EXP_KEY, JSON.stringify({ expenses: state.expenses }));\n          console.log('✅ Loaded', fbExp.length, 'expenses from Firebase +', expOnly.length, 'pending');\n        } catch (err) { console.error('Firebase expenses load failed (keeping cache):', err); }\n        try {\n          const cSnap = await firebase.firestore().collection('config').doc('closedDates').get({ source: 'server' });\n          const fbDates = (cSnap.exists && cSnap.data() && cSnap.data().dates) || [];\n          // GABUNG localStorage + Firebase supaya hari tutup tak hilang walau satu sumber kosong\n          const merged = Array.from(new Set([...(state.closedDates || []), ...fbDates]));\n          state.closedDates = merged;\n          localStorage.setItem('cuci_closed', JSON.stringify({ dates: merged }));\n        } catch (err) { console.warn('closedDates load (keeping local):', err); }\n        renderAll();\n        syncPending(false); // push anything still local-only\n      } else {\n        console.log('Firebase not available — using local cache only');\n        renderAll();\n      }\n    }\n\n    function persistLocal() {\n      localStorage.setItem(STORE_KEY, JSON.stringify({ bookings: state.bookings }));\n      localStorage.setItem(EXP_KEY, JSON.stringify({ expenses: state.expenses }));\n      localStorage.setItem('cuci_closed', JSON.stringify({ dates: state.closedDates || [] }));\n    }\n\n    // Force-pull the freshest data straight from Firebase server (bypass any cache)\n    async function refreshFromCloud() {\n      if (!fbReady()) {\n        alert('⚠️ Firebase tak connect.\\n\\nPastikan: (1) ada internet, (2) buka guna Chrome biasa — BUKAN in-app browser WhatsApp/IG, (3) buka URL deploy (mohdhasnun.github.io), bukan fail download dalam komputer.');\n        return;\n      }\n      try {\n        const bSnap = await firebase.firestore().collection('bookings').get({ source: 'server' });\n        const fbBookings = bSnap.docs.map(doc => ({ id: doc.id, ...doc.data(), _synced: true }));\n        fbBookings.forEach(b => { if (normalizeBooking(b)) fbSet('bookings', b.id, b); });\n        state.bookings = fbBookings;\n        const eSnap = await firebase.firestore().collection('expenses').get({ source: 'server' });\n        state.expenses = eSnap.docs.map(doc => ({ id: doc.id, ...doc.data(), _synced: true }));\n        persistLocal();\n        renderAll();\n        const enq = state.bookings.filter(b => b.status === 'Enquiry').length;\n        const names = state.bookings.filter(b => b.status === 'Enquiry').map(b => b.name).join(', ');\n        alert('✅ Data SEGAR dari cloud!\\n\\nJumlah booking : ' + fbBookings.length + '\\nEnquiry : ' + enq + (names ? '\\n(' + names + ')' : ''));\n      } catch (e) {\n        alert('⚠️ Gagal tarik dari cloud:\\n' + (e && e.message ? e.message : e));\n      }\n    }\n\n    // Format any date to dd/mm/yy for display (storage stays yyyy-mm-dd for sorting)\n    function formatDMY(d) {\n      if (!d) return '';\n      if (/^\\d{4}-\\d{2}-\\d{2}/.test(d)) {\n        const [y, m, day] = d.slice(0, 10).split('-');\n        return day + '/' + m + '/' + y.slice(2);\n      }\n      const dt = new Date(d);\n      if (isNaN(dt)) return d;\n      const dd = String(dt.getDate()).padStart(2, '0');\n      const mm = String(dt.getMonth() + 1).padStart(2, '0');\n      return dd + '/' + mm + '/' + String(dt.getFullYear()).slice(2);\n    }\n\n    // Nama hari dalam BM\n    const HARI = ['Ahad', 'Isnin', 'Selasa', 'Rabu', 'Khamis', 'Jumaat', 'Sabtu'];\n    function dayName(d) {\n      if (!d) return '';\n      let dt;\n      if (/^\\d{4}-\\d{2}-\\d{2}/.test(d)) { const [y, m, day] = d.slice(0, 10).split('-'); dt = new Date(Number(y), Number(m) - 1, Number(day)); }\n      else dt = new Date(d);\n      if (isNaN(dt)) return '';\n      return HARI[dt.getDay()];\n    }\n    // Highlighted date+time bar for a booking\n    function dateTimeBar(b) {\n      const hari = dayName(b.date);\n      const tarikh = formatDMY(b.date);\n      const masa = b.time ? '&nbsp;&nbsp;🕐 ' + b.time : '';\n      return '<div class=\"card-datetime\">📅 ' + (hari ? hari + ', ' : '') + tarikh + masa + '<\u002Fdiv>';\n    }\n\n    // Susun booking ikut TARIKH servis (terkini di atas); seri → ikut id terbaru\n    function bookingSortCmp(a, b) {\n      const da = (a.date || '').slice(0, 10);\n      const db = (b.date || '').slice(0, 10);\n      if (da !== db) return db.localeCompare(da);\n      return (Number(b.id) || 0) - (Number(a.id) || 0);\n    }\n\n    // Normalize legacy records (old app versions) so they show & count correctly\n    const LEGACY_STATUS = { 'Confirmed': 'Booking', 'Complete': 'Completed', 'Cancel': 'Cancelled', 'Done': 'Completed', 'Paid': 'Completed', 'Enquiries': 'Enquiry', 'Enquire': 'Enquiry', 'Inquiry': 'Enquiry', 'Pending Deposit': 'Pending' };\n    function normalizeBooking(b) {\n      let changed = false;\n      if (b.status && LEGACY_STATUS[b.status]) { b.status = LEGACY_STATUS[b.status]; changed = true; }\n      if (!b.status) { b.status = 'Pending'; changed = true; }\n      // old schema stored a `services` array of names instead of serviceItems\n      if ((!b.serviceItems || !b.serviceItems.length) && Array.isArray(b.services) && b.services.length && !b.service) {\n        b.service = b.services.join(' + ');\n        changed = true;\n      }\n      // Borang online versi lama tulis status \"Booking\" terus. Kalau belum diproses\n      // (takde harga & deposit), ia sepatutnya Enquiry supaya boleh minta deposit dulu.\n      const price = Number(b.price) || 0;\n      const dep = (Number(b.deposit) || 0) + (Number(b.depositAmount) || 0);\n      if (b.source === 'Online Form' && b.status === 'Booking' && price === 0 && dep === 0) {\n        b.status = 'Enquiry';\n        changed = true;\n      }\n      return changed;\n    }\n\n    // Show dd/mm/yyyy over the native date picker (which follows phone locale)\n    function syncDateDisplay() {\n      const inp = document.getElementById('date');\n      const disp = document.getElementById('date-display');\n      if (!inp || !disp) return;\n      if (inp.value && /^\\d{4}-\\d{2}-\\d{2}/.test(inp.value)) {\n        const [y, m, d] = inp.value.split('-');\n        disp.textContent = d + '/' + m + '/' + y;\n        disp.style.color = '#1f3d38';\n      } else {\n        disp.textContent = 'dd/mm/yyyy';\n        disp.style.color = '#cbd5e1';\n      }\n    }\n\n    /* ====== SYNC STATUS & OFFLINE SAFETY ====== */\n    function countPending() {\n      const b = state.bookings.filter(x => x._synced === false).length;\n      const e = (state.expenses || []).filter(x => x._synced === false).length;\n      return b + e;\n    }\n\n    function updateSyncStatus() {\n      const banner = document.getElementById('sync-banner');\n      if (!banner) return;\n      const pending = countPending();\n      if (!fbReady()) {\n        banner.style.display = 'block';\n        banner.style.background = '#fef3c7';\n        banner.style.color = '#92400e';\n        banner.textContent = '⚠️ OFFLINE — cloud tak connect. Data tersimpan dalam phone je' + (pending ? ' (' + pending + ' belum sync)' : '') + '. Tap untuk cuba sync.';\n      } else if (pending > 0) {\n        banner.style.display = 'block';\n        banner.style.background = '#dbeafe';\n        banner.style.color = '#1e40af';\n        banner.textContent = '🔄 ' + pending + ' rekod belum naik cloud. Tap untuk sync sekarang.';\n      } else {\n        banner.style.display = 'none';\n      }\n    }\n\n    // Push any local-only / failed records up to Firebase\n    async function syncPending(manual) {\n      if (!fbReady()) {\n        if (manual) alert('⚠️ Masih tak boleh connect ke cloud.\\n\\nCheck internet kau. Kalau buka link ni dari dalam WhatsApp/Instagram, buka guna Chrome biasa — in-app browser selalu block & padam data.');\n        updateSyncStatus();\n        return;\n      }\n      let pushed = 0;\n      for (const b of state.bookings) {\n        if (b._synced === false) {\n          const ok = await fbSet('bookings', b.id, b);\n          if (ok) { b._synced = true; pushed++; }\n        }\n      }\n      for (const e of (state.expenses || [])) {\n        if (e._synced === false) {\n          const ok = await fbSet('expenses', e.id, e);\n          if (ok) { e._synced = true; pushed++; }\n        }\n      }\n      persistLocal();\n      updateSyncStatus();\n      if (manual) alert(pushed ? ('✅ ' + pushed + ' rekod berjaya sync ke cloud!') : '✅ Semua dah sync, takde yang tertinggal.');\n    }\n\n    /* ====== MANUAL BACKUP / RESTORE (safety net) ====== */\n    function backupData() {\n      const data = { bookings: state.bookings, expenses: state.expenses, exportedAt: new Date().toISOString() };\n      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });\n      const a = document.createElement('a');\n      const stamp = new Date().toISOString().slice(0,10);\n      a.href = URL.createObjectURL(blob);\n      a.download = 'cuciseat_backup_' + stamp + '.json';\n      document.body.appendChild(a); a.click(); document.body.removeChild(a);\n      setTimeout(() => URL.revokeObjectURL(a.href), 1000);\n    }\n\n    function restoreData(ev) {\n      const file = ev.target.files && ev.target.files[0];\n      if (!file) return;\n      const reader = new FileReader();\n      reader.onload = () => {\n        try {\n          const data = JSON.parse(reader.result);\n          const bks = Array.isArray(data) ? data : (data.bookings || []);\n          const exps = (data && data.expenses) || [];\n          // Merge by id (jangan timpa, gabung)\n          const byId = {};\n          state.bookings.forEach(b => byId[String(b.id)] = b);\n          bks.forEach(b => { byId[String(b.id)] = { ...byId[String(b.id)], ...b, _synced: false }; });\n          state.bookings = Object.values(byId);\n          const eById = {};\n          (state.expenses || []).forEach(e => eById[String(e.id)] = e);\n          exps.forEach(e => { eById[String(e.id)] = { ...eById[String(e.id)], ...e, _synced: false }; });\n          state.expenses = Object.values(eById);\n          persistLocal();\n          renderAll();\n          syncPending(false);\n          alert('✅ Restore berjaya! ' + bks.length + ' booking + ' + exps.length + ' expense digabung.');\n        } catch (err) {\n          alert('❌ Fail backup tak sah / rosak.');\n        }\n        ev.target.value = '';\n      };\n      reader.readAsText(file);\n    }\n\n    // Navigation\n    const PAGE_NAV = { 'dashboard': 0, 'add-booking': 1, 'calendar': 2, 'bookings': 3, 'finance': 4 };\n    function goToPage(page) {\n      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));\n      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));\n      document.getElementById(page)?.classList.add('active');\n      const navItems = document.querySelectorAll('.bottom-nav .nav-item');\n      if (PAGE_NAV[page] !== undefined && navItems[PAGE_NAV[page]]) {\n        navItems[PAGE_NAV[page]].classList.add('active');\n      }\n      renderAll();\n      window.scrollTo(0, 0);\n    }\n\n    // ===== Service Checklist (all services visible in a box) =====\n    function buildServiceChecklist(selectedItems = []) {\n      const container = document.getElementById('service-checklist');\n      if (!container) return;\n      // Map of preselected name -> price\n      const preset = {};\n      selectedItems.forEach(it => { preset[it.name] = it.price; });\n\n      container.innerHTML = DEFAULT_SERVICES.map((svc, idx) => {\n        const isChecked = preset.hasOwnProperty(svc);\n        const priceVal = isChecked ? preset[svc] : '';\n        const isFoc = isChecked && (Number(preset[svc]) || 0) === 0;\n        return `\n          <div class=\"svc-item ${isChecked ? 'selected' : ''} ${isFoc ? 'is-foc' : ''}\" style=\"display: flex; align-items: center; gap: 12px; padding: 12px; ${idx > 0 ? 'border-top: 1px solid #f1f5f9;' : ''}\">\n            <input type=\"checkbox\" class=\"svc-check\" data-name=\"${svc.replace(/\"/g, '&quot;')}\" ${isChecked ? 'checked' : ''} onchange=\"toggleService(this)\">\n            <label class=\"svc-label\" style=\"flex: 1; font-size: 13.5px; color: #334155; cursor: pointer; line-height: 1.35;\" onclick=\"this.previousElementSibling.click()\">${svc} <span class=\"svc-foc-tag\">FOC<\u002Fspan><\u002Flabel>\n            <div style=\"display: flex; align-items: center; gap: 4px;\">\n              <span style=\"font-size: 12px; color: #94a3b8;\">RM<\u002Fspan>\n              <input type=\"number\" class=\"svc-price\" placeholder=\"0\" value=\"${priceVal}\" ${isChecked ? '' : 'disabled'} oninput=\"recalcTotal()\" style=\"width: 72px; padding: 9px; border: 1px solid #ddd; border-radius: 6px; text-align: right; font-size: 15px; ${isChecked ? '' : 'background: #f8fafc;'}\">\n            <\u002Fdiv>\n          <\u002Fdiv>\n        `;\n      }).join('');\n      recalcTotal();\n    }\n\n    function toggleService(checkbox) {\n      const row = checkbox.closest('.svc-item');\n      const priceInput = row.querySelector('.svc-price');\n      if (checkbox.checked) {\n        priceInput.disabled = false;\n        priceInput.style.background = '';\n        row.classList.add('selected');\n        priceInput.focus();\n      } else {\n        priceInput.disabled = true;\n        priceInput.value = '';\n        priceInput.style.background = '#f8fafc';\n        row.classList.remove('selected', 'is-foc');\n      }\n      recalcTotal();\n    }\n\n    function recalcTotal() {\n      let total = 0;\n      document.querySelectorAll('#service-checklist .svc-item').forEach(row => {\n        const check = row.querySelector('.svc-check');\n        if (check && check.checked) {\n          const p = Number(row.querySelector('.svc-price').value) || 0;\n          total += p;\n          row.classList.toggle('is-foc', p === 0);\n        } else {\n          row.classList.remove('is-foc');\n        }\n      });\n      const totalEl = document.getElementById('form-total');\n      if (totalEl) totalEl.textContent = 'RM ' + total.toLocaleString();\n      const priceHidden = document.getElementById('price');\n      if (priceHidden) priceHidden.value = total;\n      recalcBalance();\n    }\n\n    function recalcBalance() {\n      let total = 0;\n      document.querySelectorAll('#service-checklist .svc-item').forEach(row => {\n        const check = row.querySelector('.svc-check');\n        if (check && check.checked) {\n          total += Number(row.querySelector('.svc-price').value) || 0;\n        }\n      });\n      const deposit = Number(document.getElementById('deposit')?.value) || 0;\n      const balance = Math.max(0, total - deposit);\n      const balEl = document.getElementById('form-balance');\n      if (balEl) balEl.textContent = 'RM ' + balance.toLocaleString();\n    }\n\n    function collectServices() {\n      const items = [];\n      document.querySelectorAll('#service-checklist .svc-item').forEach(row => {\n        const check = row.querySelector('.svc-check');\n        if (check && check.checked) {\n          const name = check.getAttribute('data-name');\n          const price = Number(row.querySelector('.svc-price').value) || 0;\n          items.push({ name, price });\n        }\n      });\n      return items;\n    }\n\n    function resetServiceRows() {\n      buildServiceChecklist([]);\n      const dep = document.getElementById('deposit');\n      if (dep) dep.value = '';\n      recalcTotal();\n    }\n\n    // Save booking\n    async function saveBooking(e) {\n      e.preventDefault();\n      const serviceItems = collectServices();\n      if (serviceItems.length === 0) {\n        alert('Sila tambah sekurang-kurangnya satu servis');\n        return;\n      }\n      const total = serviceItems.reduce((s, it) => s + it.price, 0);\n      const serviceStr = serviceItems.map(it => it.name).join(' + ');\n\n      // Berapa hari kereta di kedai → kira endDate\n      const daysAtShop = Math.max(1, parseInt(document.getElementById('days-at-shop')?.value) || 1);\n      const startDateStr = document.getElementById('date').value;\n      let endDateVal = null;\n      if (daysAtShop > 1 && startDateStr) {\n        const s = new Date(startDateStr.slice(0, 10) + 'T00:00:00');\n        s.setDate(s.getDate() + daysAtShop - 1);\n        endDateVal = ymd(s);\n      }\n\n      // EDIT MODE: kemaskini rekod sedia ada (id & status kekal), bukan buat baru\n      if (editingBookingId !== null) {\n        const existing = state.bookings.find(b => b.id == editingBookingId);\n        if (existing) {\n          existing.name = document.getElementById('name').value;\n          existing.phone = document.getElementById('phone').value;\n          existing.car = document.getElementById('car').value;\n          existing.plate = document.getElementById('plate').value;\n          existing.service = serviceStr;\n          existing.serviceItems = serviceItems;\n          existing.date = document.getElementById('date').value;\n          existing.time = document.getElementById('time').value;\n          existing.endDate = endDateVal;\n          existing.price = total;\n          existing.deposit = Number(document.getElementById('deposit').value) || 0;\n          existing.material = Number(document.getElementById('material').value) || 0;\n          existing.notes = document.getElementById('notes').value;\n          existing._synced = false;\n          persistLocal();\n          renderAll();\n          const ok = await fbSet('bookings', existing.id, existing);\n          existing._synced = ok;\n          persistLocal();\n          updateSyncStatus();\n          resetEditMode();\n          alert(ok ? '✅ Booking dikemaskini & sync ke cloud!' : '⚠️ Dikemaskini dalam phone, akan auto-sync bila connect.');\n          goToPage('bookings');\n          return;\n        }\n        resetEditMode();\n      }\n\n      const booking = {\n        id: Date.now(),\n        name: document.getElementById('name').value,\n        phone: document.getElementById('phone').value,\n        car: document.getElementById('car').value,\n        plate: document.getElementById('plate').value,\n        service: serviceStr,\n        serviceItems: serviceItems,\n        date: document.getElementById('date').value,\n        time: document.getElementById('time').value,\n        endDate: endDateVal,\n        price: total,\n        deposit: Number(document.getElementById('deposit').value) || 0,\n        material: Number(document.getElementById('material').value) || 0,\n        notes: document.getElementById('notes').value,\n        status: 'Pending',\n        source: 'Manual',\n        _synced: false,\n        createdAt: new Date().toISOString()\n      };\n      state.bookings.push(booking);\n      persistLocal();\n      renderAll();\n      document.querySelector('#add-booking form').reset();\n      resetServiceRows();\n      syncDateDisplay();\n\n      const synced = await fbSet('bookings', booking.id, booking);\n      booking._synced = synced;\n      persistLocal();\n      updateSyncStatus();\n      if (synced) {\n        alert('✅ Booking disimpan & sync ke cloud!');\n      } else {\n        alert('⚠️ Booking DAH disimpan dalam phone, tapi GAGAL sync ke cloud.\\n\\nSebab biasa: internet lemah, ATAU kau buka link ni dalam in-app browser (WhatsApp/IG). Buka guna Chrome biasa untuk sync.\\n\\nData TAK hilang — dia auto-sync bila connect semula. Boleh juga tekan banner kuning untuk Sync.');\n      }\n      goToPage('bookings');\n    }\n\n    // Render all\n    function renderAll() {\n      updateDashboard();\n      renderEnquiries();\n      renderBookings();\n      renderCalendar();\n      renderFinance();\n      updateSyncStatus();\n    }\n\n    // Dashboard\n    function monthMatch(dateStr, ref) {\n      const d = new Date(dateStr);\n      return d.getMonth() === ref.getMonth() && d.getFullYear() === ref.getFullYear();\n    }\n    function isComplete(b) { return b.status === 'Completed' || b.status === 'Complete'; }\n\n    function updateDashboard() {\n      const now = new Date();\n      const total = state.bookings.length;\n      const enquiries = state.bookings.filter(b => b.status === 'Enquiry').length;\n      const booking = state.bookings.filter(b => b.status === 'Booking').length;\n\n      const thisMonth = state.bookings.filter(b => monthMatch(b.date, now));\n      const revenue = thisMonth.filter(isComplete).reduce((s, b) => s + (b.price || 0), 0);\n      const material = thisMonth.reduce((s, b) => s + (b.material || 0), 0);\n      const overhead = (state.expenses || []).filter(e => monthMatch(e.date, now)).reduce((s, e) => s + (e.amount || 0), 0);\n      const profit = revenue - material - overhead;\n      const completeCount = state.bookings.filter(isComplete).length;\n\n      document.getElementById('kpi-total').textContent = total;\n      document.getElementById('kpi-revenue').textContent = 'RM' + revenue.toLocaleString();\n      document.getElementById('kpi-material').textContent = 'RM' + material.toLocaleString();\n      document.getElementById('kpi-overhead').textContent = 'RM' + overhead.toLocaleString();\n      document.getElementById('kpi-profit').textContent = 'RM' + profit.toLocaleString();\n\n      const statusEnquiry = document.getElementById('status-enquiry');\n      if (statusEnquiry) statusEnquiry.textContent = enquiries;\n      const statusBooking = document.getElementById('status-booking');\n      if (statusBooking) statusBooking.textContent = booking;\n      const statusPending = document.getElementById('status-pending');\n      if (statusPending) statusPending.textContent = state.bookings.filter(b => b.status === 'Pending').length;\n      const statusPostponed = document.getElementById('status-postponed');\n      if (statusPostponed) statusPostponed.textContent = state.bookings.filter(b => b.status === 'Postponed').length;\n      const statusComplete = document.getElementById('status-complete');\n      if (statusComplete) statusComplete.textContent = completeCount;\n      const statusCancelled = document.getElementById('status-cancelled');\n      if (statusCancelled) statusCancelled.textContent = state.bookings.filter(b => b.status === 'Cancelled').length;\n    }\n\n    function calculateRevenue() {\n      const thisMonth = state.bookings.filter(b => {\n        const d = new Date(b.date);\n        return d.getMonth() === new Date().getMonth();\n      });\n      return thisMonth.filter(b => b.status === 'Completed').reduce((s, b) => s + (b.price || 0), 0);\n    }\n\n    function calculateMaterialCost() {\n      const thisMonth = state.bookings.filter(b => {\n        const d = new Date(b.date);\n        return d.getMonth() === new Date().getMonth();\n      });\n      return thisMonth.reduce((s, b) => s + (b.material || 0), 0);\n    }\n\n    function calculateProfit() {\n      return calculateRevenue() - calculateMaterialCost();\n    }\n\n    // Enquiries\n    function renderEnquiries() {\n      const enquiries = state.bookings.filter(b => b.status === 'Enquiry');\n      const html = enquiries.length ? enquiries.map(e => `\n        <div class=\"enquiry-card\">\n          <div class=\"card-header\">\n            <div>\n              <span class=\"card-badge badge-enquiry\">ENQUIRY<\u002Fspan>\n              <div class=\"card-name\">${e.name}<\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"card-date\">${formatDMY(e.date)}<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"card-detail-box\">\n            <div class=\"detail-row\">\n              <div class=\"detail-label\">📱 Phone:<\u002Fdiv>\n              <div class=\"detail-value\">${e.phone}<\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"detail-row\">\n              <div class=\"detail-label\">🚗 Car:<\u002Fdiv>\n              <div class=\"detail-value\">${e.car} ${e.plate ? '(' + e.plate + ')' : ''}<\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"detail-row\">\n              <div class=\"detail-label\">🔧 Service:<\u002Fdiv>\n              <div class=\"detail-value\">${e.service}<\u002Fdiv>\n            <\u002Fdiv>\n            ${e.time ? '<div class=\"detail-row\"><div class=\"detail-label\">🕐 Time:<\u002Fdiv><div class=\"detail-value\">' + e.time + '<\u002Fdiv><\u002Fdiv>' : ''}\n            ${e.notes ? '<div class=\"detail-row\"><div class=\"detail-label\">📝 Notes:<\u002Fdiv><div class=\"detail-value\">' + e.notes + '<\u002Fdiv><\u002Fdiv>' : ''}\n          <\u002Fdiv>\n          <div class=\"card-buttons\">\n            <button class=\"btn btn-deposit\" onclick=\"requestDeposit('${e.id}')\">💰 Minta Deposit<\u002Fbutton>\n            <button class=\"btn btn-edit\" onclick=\"editPrice('${e.id}')\">✏️ Edit & Set Price<\u002Fbutton>\n            <button class=\"btn btn-convert\" onclick=\"convertToBooking('${e.id}')\">✅ Convert to Booking<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      `).join('') : '<div class=\"empty\">No enquiries yet<\u002Fdiv>';\n      document.getElementById('enquiries-list').innerHTML = html;\n    }\n\n    // Bookings\n    function renderBookings() {\n      const search = (document.getElementById('search-box')?.value || '').toLowerCase();\n      let bookings = state.bookings.filter(b => b.status !== 'Enquiry');\n      if (search) {\n        bookings = bookings.filter(b => b.name.toLowerCase().includes(search) || (b.phone || '').includes(search));\n      }\n      // Newest customer at top (id = Date.now() at creation; larger = newer)\n      bookings = bookings.slice().sort(bookingSortCmp);\n\n      const html = bookings.length ? bookings.map(b => `\n        <div class=\"booking-card\">\n          <div class=\"card-header\">\n            <div>\n              <span class=\"card-badge\" style=\"${statusBadgeStyle(b.status)}\">${b.status}<\u002Fspan>\n              <div class=\"card-name\">${b.name}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          ${dateTimeBar(b)}\n          <div class=\"card-detail-box\">\n            <div class=\"detail-row\">\n              <div class=\"detail-label\">📱 Phone:<\u002Fdiv>\n              <div class=\"detail-value\">${b.phone}<\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"detail-row\">\n              <div class=\"detail-label\">🚗 Car:<\u002Fdiv>\n              <div class=\"detail-value\">${b.car} ${b.plate ? '(' + b.plate + ')' : ''}<\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"detail-row\">\n              <div class=\"detail-label\">🔧 Service:<\u002Fdiv>\n              <div class=\"detail-value\">${b.service}<\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"detail-row\">\n              <div class=\"detail-label\">💵 Price:<\u002Fdiv>\n              <div class=\"detail-value\" style=\"color: #10b981; font-weight: 700;\">RM${b.price}<\u002Fdiv>\n            <\u002Fdiv>\n            ${b.material ? '<div class=\"detail-row\"><div class=\"detail-label\">📦 Material:<\u002Fdiv><div class=\"detail-value\">RM' + b.material + '<\u002Fdiv><\u002Fdiv>' : ''}\n            ${b.notes ? '<div class=\"detail-row\"><div class=\"detail-label\">📝 Notes:<\u002Fdiv><div class=\"detail-value\">' + b.notes + '<\u002Fdiv><\u002Fdiv>' : ''}\n            <div class=\"detail-row\">\n              <div class=\"detail-label\">📊 Status:<\u002Fdiv>\n              <select onchange=\"updateStatus('${b.id}', this.value)\" style=\"flex: 1; padding: 6px; border: 1px solid #ddd; border-radius: 4px;\">\n                <option value=\"Enquiry\" ${b.status === 'Enquiry' ? 'selected' : ''}>Enquiry<\u002Foption>\n                <option value=\"Pending\" ${b.status === 'Pending' ? 'selected' : ''}>Pending<\u002Foption>\n                <option value=\"Booking\" ${b.status === 'Booking' ? 'selected' : ''}>Booking<\u002Foption>\n                <option value=\"Postponed\" ${b.status === 'Postponed' ? 'selected' : ''}>Postponed<\u002Foption>\n                <option value=\"Completed\" ${b.status === 'Completed' || b.status === 'Complete' ? 'selected' : ''}>Completed<\u002Foption>\n                <option value=\"Cancelled\" ${b.status === 'Cancelled' ? 'selected' : ''}>Cancelled<\u002Foption>\n              <\u002Fselect>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"card-buttons\">\n            ${b.status === 'Pending'\n              ? `<button class=\"btn btn-deposit\" onclick=\"requestDeposit('${b.id}')\">💰 Minta Deposit<\u002Fbutton>`\n              : (b.status === 'Completed' || b.status === 'Complete')\n                ? `<button class=\"btn btn-pickup\" onclick=\"sendPickup('${b.id}')\">🚗 Sedia Pickup<\u002Fbutton>`\n                : `<button class=\"btn btn-whatsapp\" onclick=\"sendWhatsApp('${b.id}')\">✅ Pengesahan<\u002Fbutton>`}\n            <button class=\"btn btn-edit\" onclick=\"editBooking('${b.id}')\">✏️ Edit<\u002Fbutton>\n            <button class=\"btn btn-convert\" onclick=\"showReceipt('${b.id}')\">📄 Receipt<\u002Fbutton>\n            <button class=\"btn btn-secondary\" onclick=\"deleteBooking('${b.id}')\">🗑️ Delete<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      `).join('') : '<div class=\"empty\">No bookings found<\u002Fdiv>';\n      document.getElementById('bookings-list').innerHTML = html;\n    }\n\n    // Functions\n    // Format MY phone to wa.me international format (60...)\n    function waPhone(phone) {\n      let p = (phone || '').replace(/[^0-9]/g, '');\n      if (p.startsWith('0')) p = '60' + p.slice(1);\n      else if (!p.startsWith('60')) p = '60' + p;\n      return p;\n    }\n\n    // Bank details for deposit transfer\n    const BANK_INFO = { bank: 'Maybank', name: 'Northern Hope Enterprise', account: '5521 8951 6033' };\n\n    // Footer lokasi & hubungi — label atas, URL pada baris sendiri (kemas)\n    const LINE = '─────────────────';\n    function contactFooter() {\n      return LINE + '\\n' +\n        '📍 Lokasi & Arah:\\n\\n' +\n        '🗺️ Google Maps:\\n' +\n        'https://maps.app.goo.gl/jRbBBuKDn7JsiBLy8\\n\\n' +\n        '🚗 Waze:\\n' +\n        'https://waze.com/ul/hw282cr7ky\\n\\n' +\n        '📞 017-699 3876\\n' +\n        LINE;\n    }\n\n    // Minta deposit (untuk Enquiry): tanya harga & deposit, hantar mesej transfer bank, tukar ke Pending\n    function requestDeposit(id) {\n      const booking = state.bookings.find(b => b.id == id);\n      if (!booking) return;\n      const phone = waPhone(booking.phone);\n      if (phone.length < 10) {\n        alert('⚠️ Nombor telefon customer tak sah atau kosong. Sila Edit & isi nombor dulu.');\n        return;\n      }\n\n      // 1) Harga — kalau belum set, tanya\n      let price = Number(booking.price) || 0;\n      if (price <= 0) {\n        const inp = prompt('Harga servis untuk ' + booking.name + ' (RM):', '');\n        if (inp === null) return;\n        price = Number(inp);\n        if (!price || price <= 0) { alert('⚠️ Harga tak sah.'); return; }\n      }\n\n      // 2) Jumlah deposit — guna yang dah set, atau tanya\n      let deposit = Number(booking.deposit) || 0;\n      if (deposit <= 0) {\n        const depInp = prompt('Jumlah deposit diperlukan (RM):', '');\n        if (depInp === null) return;\n        deposit = Number(depInp);\n        if (!deposit || deposit <= 0) { alert('⚠️ Jumlah deposit tak sah.'); return; }\n      }\n      if (deposit > price) { alert('⚠️ Deposit tak boleh lebih dari harga (RM' + price + ').'); return; }\n\n      // 3) Simpan harga + deposit; Enquiry -> Pending (tunggu deposit)\n      booking.price = price;\n      booking.deposit = deposit;\n      if (booking.status === 'Enquiry') booking.status = 'Pending';\n      booking._synced = false;\n      persistLocal();\n      renderAll();\n      fbSet('bookings', booking.id, booking).then(ok => { booking._synced = ok; persistLocal(); updateSyncStatus(); });\n\n      // 4) Bina mesej minta deposit\n      const line = '─────────────────';\n      const msg =\n        'Hai ' + booking.name + ',\\n\\n' +\n        'Berikut adalah butiran tempahan servis cuci kereta anda:\\n' +\n        line + '\\n' +\n        '🚗 Vehicle   : ' + booking.car + '\\n' +\n        '🔢 No. Plat  : ' + (booking.plate || '-') + '\\n' +\n        '💺 Servis    : ' + (booking.service || '-') + '\\n' +\n        '📅 Tarikh    : ' + formatDMY(booking.date) + '\\n' +\n        '🕐 Masa      : ' + (booking.time || '-') + '\\n' +\n        '💳 Harga     : RM' + price + '\\n' +\n        (booking.notes ? '📝 Nota      : ' + booking.notes + '\\n' : '') +\n        line + '\\n' +\n        '💰 MAKLUMAT DEPOSIT\\n' +\n        line + '\\n' +\n        '⚠️ Deposit Diperlukan : RM' + deposit + '\\n' +\n        'Sila transfer deposit ke:\\n' +\n        '🏦 Bank     : ' + BANK_INFO.bank + '\\n' +\n        '👤 Nama     : ' + BANK_INFO.name + '\\n' +\n        '🔢 Akaun    : ' + BANK_INFO.account + '\\n\\n' +\n        'Hantar bukti bayaran ke sini untuk kami sahkan slot anda.\\n' +\n        line + '\\n' +\n        'Terima kasih kerana memilih perkhidmatan kami! 😊';\n\n      window.open('https://wa.me/' + phone + '?text=' + encodeURIComponent(msg), '_blank');\n    }\n\n    function sendWhatsApp(id) {\n      const booking = state.bookings.find(b => b.id == id);\n      if (!booking) return;\n      const phone = waPhone(booking.phone);\n      if (phone.length < 10) {\n        alert('⚠️ Nombor telefon customer tak sah atau kosong. Sila edit booking & isi nombor dulu.');\n        return;\n      }\n\n      const price = Number(booking.price) || 0;\n      const deposit = Number(booking.deposit) || 0;\n      const baki = price - deposit;\n      const line = '─────────────────';\n\n      const msg =\n        'Hai ' + booking.name + ',\\n\\n' +\n        'Berikut adalah butiran tempahan servis anda:\\n' +\n        line + '\\n' +\n        '🚗 Vehicle   : ' + booking.car + '\\n' +\n        '🔢 No. Plat  : ' + (booking.plate || '-') + '\\n' +\n        '📱 Phone     : ' + (booking.phone || '-') + '\\n' +\n        '💺 Servis    : ' + (booking.service || '-') + '\\n' +\n        '📅 Tarikh    : ' + formatDMY(booking.date) + '\\n' +\n        '🕐 Masa      : ' + (booking.time || '-') + '\\n' +\n        '💳 Harga     : RM' + price + '\\n' +\n        (booking.notes ? '📝 Nota      : ' + booking.notes + '\\n' : '') +\n        line + '\\n' +\n        '✅ Deposit diterima : RM' + deposit + '\\n' +\n        '💵 Baki : RM' + baki + ' (dibayar selepas servis selesai)\\n' +\n        'Sila pastikan anda hadir pada tarikh dan masa yang ditetapkan.\\n' +\n        contactFooter() + '\\n\\n' +\n        'Terima kasih kerana memilih perkhidmatan kami! Jumpa nanti 😊';\n\n      window.open('https://wa.me/' + phone + '?text=' + encodeURIComponent(msg), '_blank');\n    }\n\n    // Mesej kereta dah siap untuk pickup (untuk status Completed)\n    function sendPickup(id) {\n      const booking = state.bookings.find(b => b.id == id);\n      if (!booking) return;\n      const phone = waPhone(booking.phone);\n      if (phone.length < 10) { alert('⚠️ Nombor telefon customer tak sah atau kosong.'); return; }\n      const line = '─────────────────';\n      const price = Number(booking.price) || 0;\n      const deposit = Number(booking.deposit) || 0;\n      const baki = price - deposit;\n      const bakiLine = baki > 0 ? '\\n💵 Baki untuk dijelaskan : RM' + baki + '\\n' : '\\n';\n      const msg =\n        'Hai ' + booking.name + ',\\n\\n' +\n        'Kereta anda sudah SIAP! 🚗✨\\n' +\n        line + '\\n' +\n        '🚗 Vehicle   : ' + booking.car + '\\n' +\n        '🔢 No. Plat  : ' + (booking.plate || '-') + '\\n' +\n        '💺 Servis    : ' + (booking.service || '-') + '\\n' +\n        line + '\\n' +\n        'Seat/kusyen kereta anda dah siap dibersihkan dan boleh diambil sekarang.\\n' +\n        bakiLine +\n        contactFooter() + '\\n\\n' +\n        'Terima kasih kerana memilih perkhidmatan kami! 😊';\n      window.open('https://wa.me/' + phone + '?text=' + encodeURIComponent(msg), '_blank');\n    }\n\n    function editPrice(id) {\n      const price = prompt('Enter price:');\n      if (price) {\n        const booking = state.bookings.find(b => b.id == id);\n        if (booking) {\n          booking.price = Number(price);\n          persistLocal();\n          fbSet('bookings', booking.id, booking);\n        }\n        renderAll();\n      }\n    }\n\n    function resetEditMode() {\n      editingBookingId = null;\n      const sb = document.getElementById('save-booking-btn');\n      if (sb) sb.textContent = '💾 Save Booking';\n      const hdr = document.getElementById('add-booking-title');\n      if (hdr) hdr.textContent = 'Add Booking';\n      const daysSel = document.getElementById('days-at-shop');\n      if (daysSel) daysSel.value = '1';\n    }\n\n    // Buka borang KOSONG untuk booking baru (reset mod edit dulu)\n    function newBooking() {\n      resetEditMode();\n      const form = document.querySelector('#add-booking form');\n      if (form) form.reset();\n      resetServiceRows();\n      syncDateDisplay();\n      goToPage('add-booking');\n    }\n\n    function editBooking(id) {\n      const booking = state.bookings.find(b => b.id == id);\n      if (booking) {\n        document.getElementById('name').value = booking.name;\n        document.getElementById('phone').value = booking.phone;\n        document.getElementById('car').value = booking.car;\n        document.getElementById('plate').value = booking.plate || '';\n        document.getElementById('date').value = booking.date;\n        syncDateDisplay();\n        document.getElementById('time').value = booking.time || '';\n        const daysSel = document.getElementById('days-at-shop');\n        if (daysSel) daysSel.value = String(booking.endDate ? bookingDates(booking).length : 1);\n        document.getElementById('material').value = booking.material || 0;\n        document.getElementById('notes').value = booking.notes || '';\n        if (document.getElementById('deposit')) document.getElementById('deposit').value = booking.deposit || '';\n\n        // Populate service checklist with this booking's services\n        let items = [];\n        if (booking.serviceItems && booking.serviceItems.length) {\n          items = booking.serviceItems;\n        } else if (booking.service) {\n          const names = booking.service.split('+').map(s => s.trim());\n          items = names.map((n, i) => ({ name: n, price: i === 0 ? booking.price : 0 }));\n        }\n        buildServiceChecklist(items);\n        recalcTotal();\n\n        // EDIT-IN-PLACE: jangan padam rekod. Tandakan id yang sedang diedit;\n        // saveBooking akan kemaskini rekod yang sama (id & status kekal).\n        editingBookingId = id;\n        const sb = document.getElementById('save-booking-btn');\n        if (sb) sb.textContent = '💾 Update Booking';\n        const hdr = document.getElementById('add-booking-title');\n        if (hdr) hdr.textContent = 'Edit Booking';\n        goToPage('add-booking');\n      }\n    }\n\n    function convertToBooking(id) {\n      const booking = state.bookings.find(b => b.id == id);\n      if (booking) {\n        booking.status = 'Booking';\n        persistLocal();\n        fbSet('bookings', booking.id, booking);\n        updateDashboard();\n      }\n    }\n\n    function updateStatus(id, status) {\n      const booking = state.bookings.find(b => b.id == id);\n      if (booking) {\n        booking.status = status;\n        persistLocal();\n        fbSet('bookings', booking.id, booking);\n        updateDashboard();\n      }\n    }\n\n    function deleteBooking(id) {\n      if (confirm('Delete this booking?')) {\n        state.bookings = state.bookings.filter(b => b.id != id);\n        persistLocal();\n        fbDelete('bookings', id);\n        renderAll();\n      }\n    }\n\n    function showReceipt(id) {\n      currentReceiptId = id;\n      const booking = state.bookings.find(b => b.id == id);\n      if (booking) {\n        const receiptNo = 'RCP' + String(booking.id).slice(-6);\n        const today = new Date();\n        const date = formatDMY(today);\n        const time = today.toLocaleTimeString('en-MY', { hour: '2-digit', minute: '2-digit' });\n\n        const receiptHTML = `\n          <div id=\"receipt-printable\" style=\"width: 480px; margin: 0 auto; background: #ffffff; font-family: 'Manrope', Arial, sans-serif; color: #3a414c; overflow: hidden; border: 1px solid #eceef2;\">\n            <!-- Header Band -->\n            <div style=\"background: linear-gradient(135deg, #1f3d38 0%, #2f5650 100%); color: #f3f4f6; padding: 28px 30px;\">\n              <div style=\"display: flex; justify-content: space-between; align-items: flex-start;\">\n                <div>\n                  <div style=\"font-size: 22px; font-weight: 700; letter-spacing: -0.3px;\">Cuci Seat Kereta<\u002Fdiv>\n                  <div style=\"font-size: 11px; color: #9db4d4; margin-top: 4px; letter-spacing: 1px; text-transform: uppercase;\">Pakar Hygiene Dalaman Kereta<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"text-align: right; font-size: 10px; color: #9db4d4; line-height: 1.6;\">\n                  Northern Hope Enterprise<br>(00374641-A)\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-size: 10px; color: #9db4d4; margin-top: 14px; line-height: 1.6; border-top: 1px solid rgba(255,255,255,0.15); padding-top: 12px;\">\n                📍 Blok D-00-01, Pangsapuri Mawar, Jln KP 4/4, Taman Kota Perdana, 43300 Seri Kembangan, Selangor<br>\n                📱 017-699 3876 &nbsp;|&nbsp; 🌐 cuciseatkereta.com\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <!-- Accent strip -->\n            <div style=\"height: 3px; background: #c2a878;\"><\u002Fdiv>\n\n            <!-- Body -->\n            <div style=\"padding: 26px 30px;\">\n\n              <!-- Receipt title + meta -->\n              <div style=\"display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 24px;\">\n                <div>\n                  <div style=\"font-size: 25px; font-weight: 700; color: #2b3340; letter-spacing: -0.5px;\">RESIT<\u002Fdiv>\n                  <div style=\"font-size: 13px; color: #b08d57; font-weight: 600; margin-top: 2px;\">${receiptNo}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"text-align: right;\">\n                  <div style=\"font-size: 10px; color: #9aa3b0; font-weight: 600; letter-spacing: 0.5px;\">TARIKH<\u002Fdiv>\n                  <div style=\"font-size: 14px; font-weight: 600; color: #2b3340;\">${date}<\u002Fdiv>\n                  <div style=\"font-size: 10px; color: #9aa3b0; margin-top: 2px;\">${time}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <!-- Customer & Vehicle -->\n              <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 22px;\">\n                <div style=\"background: #f7f8fa; border-left: 3px solid #8a93a0; padding: 14px; border-radius: 0 6px 6px 0;\">\n                  <div style=\"color: #9aa3b0; font-weight: 700; font-size: 9px; letter-spacing: 0.5px; margin-bottom: 6px;\">PELANGGAN<\u002Fdiv>\n                  <div style=\"font-weight: 800; color: #1f3d38; font-size: 15px;\">${booking.name}<\u002Fdiv>\n                  <div style=\"color: #6b7480; font-size: 12px; margin-top: 4px;\">${booking.phone}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"background: #f7f8fa; border-left: 3px solid #c2a878; padding: 14px; border-radius: 0 6px 6px 0;\">\n                  <div style=\"color: #9aa3b0; font-weight: 700; font-size: 9px; letter-spacing: 0.5px; margin-bottom: 6px;\">KENDERAAN<\u002Fdiv>\n                  <div style=\"font-weight: 800; color: #1f3d38; font-size: 15px;\">${booking.car}<\u002Fdiv>\n                  <div style=\"color: #6b7480; font-size: 12px; margin-top: 4px;\"
